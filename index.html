function MiniBarChart({ data, maxVal, color }) {
  const max = maxVal || Math.max(1, ...data.map((d) => d.value));
  return (
    <div className="flex items-end gap-1.5" style={{ height: 90 }}>
      {data.map((d, i) => (
        <div key={i} className="flex-1 flex flex-col items-center justify-end" style={{ height: "100%" }}>
          <div className="w-full rounded-sm" style={{ height: `${max > 0 ? Math.max(2, (d.value / max) * 100) : 2}%`, background: color, minHeight: 2 }} />
          <div className="mono text-xs mt-1.5" style={{ color: SLATE, fontSize: 9 }}>{d.label}</div>
        </div>
      ))}
    </div>
  );
}

function ReportsModal({ employees, entries, jobSites, timeOffMarks, settings, onClose }) {
  const [preset, setPreset] = useState("month");

  const { rangeStart, rangeEnd } = useMemo(() => {
    const today = todayStr();
    if (preset === "month") return { rangeStart: addDays(today, -29), rangeEnd: today };
    if (preset === "3months") return { rangeStart: addDays(today, -89), rangeEnd: today };
    if (preset === "year") return { rangeStart: addDays(today, -364), rangeEnd: today };
    const oldest = entries.reduce((min, t) => (t.date < min ? t.date : min), today);
    return { rangeStart: oldest, rangeEnd: today };
  }, [preset, entries]);

  const rangedEntries = useMemo(() => entries.filter((t) => t.date >= rangeStart && t.date <= rangeEnd), [entries, rangeStart, rangeEnd]);

  // ---- Weekly buckets for cost + overtime trend ----
  const weekBuckets = useMemo(() => {
    const buckets = {};
    for (const t of rangedEntries) {
      const wk = getWeekStart(t.date, settings.payPeriod && settings.payPeriod.weekStartsOn);
      if (!buckets[wk]) buckets[wk] = {};
      buckets[wk][t.employeeId] = (buckets[wk][t.employeeId] || 0) + t.hours;
    }
    const weeks = Object.keys(buckets).sort();
    const otOn = settings.overtime && settings.overtime.enabled;
    const multiplier = otOn ? settings.overtime.multiplier : 1;
    return weeks.slice(-8).map((wk) => {
      let cost = 0, otHours = 0;
      for (const empId in buckets[wk]) {
        const emp = employees.find((e) => e.id === empId);
        if (!emp) continue;
        const hrs = buckets[wk][empId];
        let reg = hrs, ot = 0;
        if (otOn && hrs > 40) { reg = 40; ot = hrs - 40; }
        cost += reg * emp.rate + ot * emp.rate * multiplier;
        otHours += ot;
      }
      return { label: wk.slice(5).replace("-", "/"), cost, otHours };
    });
  }, [rangedEntries, employees, settings]);

  // ---- Hours & cost by job site ----
  const siteBreakdown = useMemo(() => {
    const map = {};
    for (const t of rangedEntries) {
      const key = t.siteId || "none";
      if (!map[key]) map[key] = { hours: 0, cost: 0 };
      const emp = employees.find((e) => e.id === t.employeeId);
      map[key].hours += t.hours;
      if (emp) map[key].cost += t.hours * emp.rate;
    }
    return Object.entries(map)
      .map(([siteId, v]) => ({ site: jobSites.find((s) => s.id === siteId), siteId, ...v }))
      .sort((a, b) => b.hours - a.hours);
  }, [rangedEntries, employees, jobSites]);

  // ---- Crew comparison ----
  const crewBreakdown = useMemo(() => {
    const map = {};
    for (const t of rangedEntries) map[t.employeeId] = (map[t.employeeId] || 0) + t.hours;
    return employees
      .map((e) => ({ employee: e, hours: map[e.id] || 0 }))
      .filter((r) => r.hours > 0)
      .sort((a, b) => b.hours - a.hours);
  }, [rangedEntries, employees]);

  // ---- Attendance reliability (No Clock-In reasons within range) ----
  const attendance = useMemo(() => {
    const counts = {};
    for (const key in timeOffMarks || {}) {
      const [empId, date] = key.split("|");
      if (date < rangeStart || date > rangeEnd) continue;
      if (!counts[empId]) counts[empId] = {};
      const reason = timeOffMarks[key];
      counts[empId][reason] = (counts[empId][reason] || 0) + 1;
    }
    return employees
      .map((e) => {
        const reasons = counts[e.id] || {};
        const total = Object.values(reasons).reduce((s, n) => s + n, 0);
        const top = Object.entries(reasons).sort((a, b) => b[1] - a[1])[0];
        return { employee: e, total, topReason: top ? top[0] : null };
      })
      .filter((r) => r.total > 0)
      .sort((a, b) => b.total - a.total);
  }, [timeOffMarks, employees, rangeStart, rangeEnd]);

  const totalCost = weekBuckets.reduce((s, w) => s + w.cost, 0);
  const totalOT = weekBuckets.reduce((s, w) => s + w.otHours, 0);

  function exportCSV() {
    const rows = [["Date", "Employee", "Job Site", "Hours", "Estimated Pay"]];
    for (const t of rangedEntries) {
      const emp = employees.find((e) => e.id === t.employeeId);
      const site = jobSites.find((s) => s.id === t.siteId);
      rows.push([t.date, emp ? emp.name : "Unknown", site ? site.name : "", t.hours, emp ? (t.hours * emp.rate).toFixed(2) : ""]);
    }
    const csv = rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
    const blob = new Blob([csv], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `labourarc-report-${rangeStart}-to-${rangeEnd}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }

  return (
    <div className="no-print fixed inset-0 flex items-end sm:items-center justify-center p-0 sm:p-5" style={{ background: "rgba(0,0,0,0.6)", zIndex: 50 }} onClick={onClose}>
      <div className="w-full sm:max-w-lg rounded-t-2xl sm:rounded-2xl overflow-hidden" style={{ background: CARD, maxHeight: "90vh", display: "flex", flexDirection: "column" }} onClick={(e) => e.stopPropagation()}>
        <div className="stripe-divider" />
        <div className="px-5 pt-4 pb-3 flex items-start justify-between" style={{ borderBottom: `1px solid ${BORDER}` }}>
          <div className="brand text-xl" style={{ color: NAVY, fontWeight: 800 }}>Reports</div>
          <button onClick={onClose} style={{ color: SLATE }}><XIcon size={18} /></button>
        </div>

        <div className="overflow-y-auto px-5 py-4" style={{ flex: 1 }}>
          <div className="flex gap-2 mb-4">
            {[{ id: "month", label: "30 Days" }, { id: "3months", label: "3 Months" }, { id: "year", label: "1 Year" }, { id: "all", label: "All Time" }].map((p) => (
              <button key={p.id} onClick={() => setPreset(p.id)} className="flex-1 text-xs py-2 rounded-lg" style={{ fontWeight: 700, background: preset === p.id ? ROYAL : BG, color: preset === p.id ? "white" : NAVY }}>{p.label}</button>
            ))}
          </div>

          <div className="flex gap-2 mb-5">
            <div className="flex-1 p-3 rounded-lg text-center" style={{ background: BG, border: `1px solid ${BORDER}` }}>
              <div className="brand text-xl" style={{ color: ROYAL, fontWeight: 800 }}>{fmtMoney(totalCost, settings.currency)}</div>
              <div className="mono text-xs" style={{ color: SLATE }}>LABOR COST</div>
            </div>
            <div className="flex-1 p-3 rounded-lg text-center" style={{ background: BG, border: `1px solid ${BORDER}` }}>
              <div className="brand text-xl" style={{ color: YELLOW, fontWeight: 800 }}>{totalOT.toFixed(1)}h</div>
              <div className="mono text-xs" style={{ color: SLATE }}>OVERTIME</div>
            </div>
          </div>

          <div className="brand text-sm mb-2" style={{ color: NAVY, fontWeight: 700, letterSpacing: "0.02em" }}>LABOR COST TREND</div>
          {weekBuckets.length === 0 ? <div className="text-xs mb-4" style={{ color: SLATE }}>No data in this range.</div> : (
            <div className="p-3 rounded-lg mb-5" style={{ background: BG, border: `1px solid ${BORDER}` }}>
              <MiniBarChart data={weekBuckets.map((w) => ({ label: w.label, value: w.cost }))} color={ROYAL} />
            </div>
          )}

          {settings.overtime && settings.overtime.enabled && (
            <>
              <div className="brand text-sm mb-2" style={{ color: NAVY, fontWeight: 700, letterSpacing: "0.02em" }}>OVERTIME TREND</div>
              <div className="p-3 rounded-lg mb-5" style={{ background: BG, border: `1px solid ${BORDER}` }}>
                <MiniBarChart data={weekBuckets.map((w) => ({ label: w.label, value: w.otHours }))} color={YELLOW} />
              </div>
            </>
          )}

          <div className="brand text-sm mb-2" style={{ color: NAVY, fontWeight: 700, letterSpacing: "0.02em" }}>HOURS & COST BY JOB SITE</div>
          {siteBreakdown.length === 0 ? <div className="text-xs mb-4" style={{ color: SLATE }}>No hours logged in this range.</div> : (
            <div className="mb-5">
              {siteBreakdown.map((r) => (
                <Row key={r.siteId}>
                  <div style={{ color: NAVY, fontWeight: 600 }}>{r.site ? r.site.name : "No site set"}</div>
                  <div className="text-right">
                    <div className="mono text-sm" style={{ color: ROYAL, fontWeight: 700 }}>{fmtMoney(r.cost, settings.currency)}</div>
                    <div className="mono text-xs" style={{ color: SLATE }}>{r.hours.toFixed(1)}h</div>
                  </div>
                </Row>
              ))}
            </div>
          )}

          <div className="brand text-sm mb-2" style={{ color: NAVY, fontWeight: 700, letterSpacing: "0.02em" }}>CREW COMPARISON</div>
          {crewBreakdown.length === 0 ? <div className="text-xs mb-4" style={{ color: SLATE }}>No hours logged in this range.</div> : (
            <div className="mb-5">
              {crewBreakdown.map((r) => (
                <Row key={r.employee.id}>
                  <div style={{ color: NAVY, fontWeight: 600 }}>{r.employee.name}</div>
                  <div className="mono text-sm" style={{ color: ROYAL, fontWeight: 700 }}>{r.hours.toFixed(1)}h</div>
                </Row>
              ))}
            </div>
          )}

          <div className="brand text-sm mb-2" style={{ color: NAVY, fontWeight: 700, letterSpacing: "0.02em" }}>ATTENDANCE RELIABILITY</div>
          {attendance.length === 0 ? (
            <div className="text-xs mb-2" style={{ color: SLATE }}>No missed-day reasons logged in this range.</div>
          ) : (
            attendance.map((r) => (
              <Row key={r.employee.id}>
                <div style={{ color: NAVY, fontWeight: 600 }}>{r.employee.name}</div>
                <div className="text-right">
                  <div className="mono text-sm" style={{ color: YELLOW, fontWeight: 700 }}>{r.total} missed day{r.total > 1 ? "s" : ""}</div>
                  {r.topReason && <div className="text-xs" style={{ color: SLATE }}>Most common: {r.topReason}</div>}
                </div>
              </Row>
            ))
          )}
        </div>

        <div className="px-5 pb-5 pt-2">
          <button onClick={exportCSV} className="w-full text-sm px-4 py-3 rounded-lg text-white flex items-center justify-center gap-2" style={{ background: ROYAL, fontWeight: 800 }}>
            <DownloadIcon size={15} />Export CSV
          </button>
        </div>
      </div>
    </div>
  );
}

function ShareButton({ employee, rangeStart, rangeEnd, gridHours, settings, fullWidth }) {
  const [copied, setCopied] = useState(false);
  async function doShare() {
    const days = dateRange(rangeStart, rangeEnd);
    const calc = calcPay(employee, days, gridHours, settings);
    const text = `LabourArc Payslip\n${employee.name}\nPeriod: ${rangeStart} to ${rangeEnd}\nHours: ${calc.totalHours.toFixed(2)}h\nGross: ${fmtMoney(calc.gross, settings.currency)}\nNet: ${fmtMoney(calc.net, settings.currency)}`;
    try {
      if (navigator.share) {
        await navigator.share({ title: "Payslip — " + employee.name, text });
      } else {
        await navigator.clipboard.writeText(text);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      }
    } catch {}
  }
  return (
    <button onClick={doShare} className={`text-xs px-3 py-1.5 rounded-full flex items-center gap-1.5 ${fullWidth ? "flex-1 justify-center" : ""}`} style={{ fontWeight: 700, background: BG, color: NAVY, border: `1px solid ${BORDER}` }}>
      {copied ? <CheckIcon size={12} /> : <ShareIcon size={12} />}{copied ? "Copied" : "Share"}

  );
}

function SettingsModal({ employerPin, workspace, settings, jobSites, onChangePin, onSaveSettings, onSaveSites, allData, onImport, onClose, onLogout, onContactUs }) {
  const [changing, setChanging] = useState(false);
  const [copied, setCopied] = useState(false);
  const [local, setLocal] = useState(settings);
  const [logoError, setLogoError] = useState("");
  const [newDedLabel, setNewDedLabel] = useState("");
  const [newDedType, setNewDedType] = useState("percent");
  const [newDedValue, setNewDedValue] = useState("");
  const [pushOn, setPushOn] = useState(() => localStorage.getItem("la_push_employer") === "1");
  const [pushBusy, setPushBusy] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [deleteTyped, setDeleteTyped] = useState("");
  const [deleting, setDeleting] = useState(false);
  const [deleteErr, setDeleteErr] = useState("");
  const fileRef = useRef(null);
  const logoRef = useRef(null);

  async function handleDeleteAccount() {
    if (deleteTyped.trim().toUpperCase() !== "DELETE") return;
    setDeleting(true);
    setDeleteErr("");
    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/delete-account`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${SUPABASE_ANON_KEY}`, apikey: SUPABASE_ANON_KEY },
        body: JSON.stringify({ workspaceId: workspace.id }),
      });
      if (!res.ok) throw new Error("Delete failed (" + res.status + ")");
      await sb.auth.signOut();
      window.location.reload();
    } catch (e) {
      setDeleteErr(e.message || "Couldn't delete your account — check your connection and try again.");
      setDeleting(false);
    }
  }

  function save(next) {
    setLocal(next);
    onSaveSettings(next);
  }

  async function toggleEmployerPush() {
    if (pushOn) { setPushOn(false); localStorage.setItem("la_push_employer", "0"); return; }
    if (!workspace) return;
    setPushBusy(true);
    const res = await subscribeToPush(workspace.id, "employer", null);
    setPushBusy(false);
    if (res.ok) { setPushOn(true); localStorage.setItem("la_push_employer", "1"); }
    else alert("Couldn't enable notifications — check your device's notification settings and try again.");
  }

  function copyCode() {
    if (!workspace) return;
    navigator.clipboard.writeText(workspace.company_code).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    });
  }

  function handleLogoFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    setLogoError("");
    if (!["image/png", "image/jpeg"].includes(file.type)) { setLogoError("Please use a PNG or JPG image."); return; }
    if (file.size > 500 * 1024) { setLogoError("Please use an image under 500KB. A square logo works best."); return; }
    const reader = new FileReader();
    reader.onload = () => save({ ...local, company: { ...local.company, logo: reader.result } });
    reader.readAsDataURL(file);
  }

  function addDeduction() {
    if (!newDedLabel.trim() || !newDedValue || Number(newDedValue) <= 0) return;
    const next = { ...local, deductions: [...(local.deductions || []), { id: uid(), label: newDedLabel.trim(), type: newDedType, value: Number(newDedValue) }] };
    save(next);
    setNewDedLabel(""); setNewDedValue("");
  }
  function removeDeduction(id) {
    save({ ...local, deductions: (local.deductions || []).filter((d) => d.id !== id) });
  }

  function exportBackup() {
    const blob = new Blob([JSON.stringify(allData, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `labourarc-backup-${todayStr()}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function handleImportFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (!window.confirm("This will overwrite the shared data for everyone using the app. Continue?")) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        onImport(data);
        alert("Backup imported.");
      } catch {
        alert("Couldn't read that file — make sure it's a LabourArc backup JSON.");
      }
    };
    reader.readAsText(file);
  }

  return (
    <div className="fixed inset-0 flex items-end sm:items-center justify-center p-0 sm:p-5" style={{ background: "rgba(11,30,61,0.55)", zIndex: 50 }} onClick={onClose}>
      <div className="w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-5 overflow-y-auto" style={{ background: CARD, maxHeight: "88vh" }} onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-4">
          <div className="text-sm" style={{ color: NAVY, fontWeight: 700 }}>Settings</div>
          <button onClick={onClose} style={{ color: SLATE }}><XIcon size={18} /></button>
        </div>

        {workspace && (
          <div className="rounded-lg p-4 mb-4" style={{ background: `linear-gradient(135deg, ${DARK}, ${DARK2})` }}>
            <div className="text-xs" style={{ color: "#9FB3D9", fontWeight: 600 }}>{workspace.name}</div>
            <div className="text-xs mt-1 mb-2" style={{ color: "#C9D3E6" }}>Share this code with your crew so they can join:</div>
            <div className="flex items-center justify-between">
              <div className="mono text-2xl" style={{ color: ROYAL_L, fontWeight: 700, letterSpacing: "0.15em" }}>{workspace.company_code}</div>
              <button onClick={copyCode} className="text-xs px-3 py-1.5 rounded-lg" style={{ background: "rgba(255,255,255,0.12)", color: "white", fontWeight: 600 }}>
                {copied ? "Copied" : "Copy"}
              </button>
            </div>
          </div>
        )}

        <Section title="Account">
          <button onClick={onContactUs} className="w-full text-left text-sm px-4 py-3 rounded-lg mb-2" style={{ background: BG, color: NAVY, fontWeight: 600 }}>Contact Us</button>
          <button onClick={onLogout} className="w-full text-left text-sm px-4 py-3 rounded-lg" style={{ background: BG, color: NAVY, fontWeight: 600 }}>Log Out</button>
        </Section>

        <Section title="Notifications">
          <button onClick={toggleEmployerPush} disabled={pushBusy} className="w-full text-left text-sm px-4 py-3 rounded-lg flex items-center justify-between" style={{ background: pushOn ? "rgba(255,107,26,0.15)" : BG, color: NAVY, fontWeight: 600 }}>
            <span>Push notifications (hours logged, unusual hours)</span>
            <span style={{ color: pushOn ? ROYAL : SLATE, fontWeight: 700 }}>{pushBusy ? "…" : pushOn ? "On" : "Off"}</span>
          </button>
        </Section>

        <Section title="Security">
          {!changing ? (
            <button onClick={() => setChanging(true)} className="w-full text-left text-sm px-4 py-3 rounded-lg mb-2 flex items-center gap-2" style={{ background: BG, color: NAVY, fontWeight: 600 }}>
              <LockIcon size={15} color={ROYAL} />Change Employer PIN
            </button>
          ) : (
            <div className="mb-2">
              <CreatePin title="New Employer PIN" subtitle="" pinLength={local.pinLength} onDone={(pin) => { onChangePin(pin); setChanging(false); }} onBack={() => setChanging(false)} inline />
            </div>
          )}
          <div className="text-xs mb-1" style={{ color: SLATE, fontWeight: 600 }}>PIN length (for you and your crew)</div>
          <div className="flex gap-2">
            {[4, 6].map((n) => (
              <button key={n} onClick={() => save({ ...local, pinLength: n })} className="flex-1 text-sm py-2 rounded-lg" style={{ fontWeight: 700, background: local.pinLength === n ? ROYAL : BG, color: local.pinLength === n ? "white" : NAVY }}>{n}-digit</button>
            ))}
          </div>
        </Section>

        <Section title="Currency">
          <select value={local.currency} onChange={(e) => save({ ...local, currency: e.target.value })} className="w-full px-3 py-2 rounded-lg border text-sm" style={{ borderColor: BORDER }}>
            {CURRENCIES.map((c) => <option key={c} value={c}>{c}</option>)}
          </select>
        </Section>

        <Section title="Overtime">
          <div className="flex items-center justify-between mb-2">
            <div className="text-sm" style={{ color: NAVY }}>Enable overtime pay</div>
            <button onClick={() => save({ ...local, overtime: { ...local.overtime, enabled: !local.overtime.enabled } })} className="rounded-full" style={{ width: 42, height: 24, background: local.overtime.enabled ? ROYAL : "#D8DEEA", position: "relative" }}>
              <div className="rounded-full bg-white" style={{ width: 18, height: 18, position: "absolute", top: 3, left: local.overtime.enabled ? 21 : 3, transition: "left .15s" }} />
            </button>
          </div>
          {local.overtime.enabled && (
            <>
              <div className="text-xs mb-1" style={{ color: SLATE, fontWeight: 600 }}>Multiplier</div>
              <div className="flex gap-2 mb-3">
                {[1.5, 2].map((m) => (
                  <button key={m} onClick={() => save({ ...local, overtime: { ...local.overtime, multiplier: m } })} className="flex-1 text-sm py-2 rounded-lg" style={{ fontWeight: 700, background: local.overtime.multiplier === m ? ROYAL : BG, color: local.overtime.multiplier === m ? "white" : NAVY }}>{m}x</button>
                ))}
              </div>
              <div className="text-xs mb-1" style={{ color: SLATE, fontWeight: 600 }}>Threshold</div>
              <div className="flex gap-2">
                <button onClick={() => save({ ...local, overtime: { ...local.overtime, threshold: "weekly" } })} className="flex-1 text-sm py-2 rounded-lg" style={{ fontWeight: 700, background: local.overtime.threshold === "weekly" ? ROYAL : BG, color: local.overtime.threshold === "weekly" ? "white" : NAVY }}>Weekly (&gt;40h)</button>
                <button onClick={() => save({ ...local, overtime: { ...local.overtime, threshold: "daily" } })} className="flex-1 text-sm py-2 rounded-lg" style={{ fontWeight: 700, background: local.overtime.threshold === "daily" ? ROYAL : BG, color: local.overtime.threshold === "daily" ? "white" : NAVY }}>Daily (&gt;8h)</button>
              </div>
            </>
          )}
        </Section>

        <Section title="Break Deduction">
          <div className="flex items-center justify-between mb-2">
            <div className="text-sm" style={{ color: NAVY }}>Automatically deduct a break</div>
            <button onClick={() => save({ ...local, breakDeduction: { ...local.breakDeduction, enabled: !local.breakDeduction.enabled } })} className="rounded-full" style={{ width: 42, height: 24, background: local.breakDeduction.enabled ? ROYAL : "#D8DEEA", position: "relative" }}>
              <div className="rounded-full bg-white" style={{ width: 18, height: 18, position: "absolute", top: 3, left: local.breakDeduction.enabled ? 21 : 3, transition: "left .15s" }} />
            </button>
          </div>
          {local.breakDeduction.enabled && (
            <div className="mb-2">
              <div className="grid grid-cols-3 gap-2 mb-2">
                {[15, 30, 45, 60, 75, 90].map((m) => (
                  <button key={m} onClick={() => save({ ...local, breakDeduction: { ...local.breakDeduction, minutes: m } })} className="text-sm py-2 rounded-lg" style={{ fontWeight: 700, background: local.breakDeduction.minutes === m ? ROYAL : BG, color: local.breakDeduction.minutes === m ? "white" : NAVY }}>{m >= 60 ? (m / 60) + " hr" + (m > 60 ? " " + (m - 60) + "m" : "") : m + " min"}</button>
                ))}
              </div>
              <div className="flex items-center gap-2">
                <div className="text-xs" style={{ color: SLATE, fontWeight: 600 }}>Custom:</div>
                <input type="number" min="1" value={![15, 30, 45, 60, 75, 90].includes(local.breakDeduction.minutes) ? local.breakDeduction.minutes : ""} onChange={(e) => { const v = Number(e.target.value); if (v > 0) save({ ...local, breakDeduction: { ...local.breakDeduction, minutes: v } }); }} placeholder="e.g. 20" className="w-24 px-2 py-1.5 rounded-lg border text-sm mono" style={{ borderColor: BORDER }} />
                <div className="text-xs" style={{ color: SLATE }}>minutes</div>
              </div>
            </div>
          )}
          <div className="text-xs mt-2" style={{ color: SLATE }}>Subtracted once per day worked, before overtime is calculated.</div>
        </Section>

        <Section title="Time Rounding">
          <div className="flex items-center justify-between mb-2">
            <div className="text-sm" style={{ color: NAVY }}>Round clock in/out times</div>
            <button onClick={() => save({ ...local, rounding: { ...local.rounding, enabled: !local.rounding.enabled } })} className="rounded-full" style={{ width: 42, height: 24, background: local.rounding.enabled ? ROYAL : "#D8DEEA", position: "relative" }}>
              <div className="rounded-full bg-white" style={{ width: 18, height: 18, position: "absolute", top: 3, left: local.rounding.enabled ? 21 : 3, transition: "left .15s" }} />
            </button>
          </div>
          {local.rounding.enabled ? (
            <>
              <div className="flex gap-2">
                {[5, 10, 15, 30].map((m) => (
                  <button key={m} onClick={() => save({ ...local, rounding: { ...local.rounding, interval: m } })} className="flex-1 text-sm py-2 rounded-lg" style={{ fontWeight: 700, background: local.rounding.interval === m ? ROYAL : BG, color: local.rounding.interval === m ? "white" : NAVY }}>{m} min</button>
                ))}
              </div>
              <div className="text-xs mt-2" style={{ color: SLATE }}>Hours are rounded to the nearest {local.rounding.interval} minutes — fair to both sides, never consistently favors one.</div>
            </>
          ) : (
            <div className="text-xs" style={{ color: SLATE }}>Off — employees are paid for the exact minutes they worked, no rounding.</div>
          )}
        </Section>

        <Section title="Travel Time">
          <div className="flex items-center justify-between">
            <div>
              <div className="text-sm" style={{ color: NAVY }}>Track travel between job sites</div>
              <div className="text-xs mt-0.5" style={{ color: SLATE }}>Employees can log travel minutes alongside their hours — paid at the same rate, shown separately on the timesheet and payslip.</div>
            </div>
            <button onClick={() => save({ ...local, travelTime: { ...local.travelTime, enabled: !local.travelTime.enabled } })} className="rounded-full flex-shrink-0" style={{ width: 42, height: 24, background: local.travelTime.enabled ? ROYAL : "#D8DEEA", position: "relative", marginLeft: 12 }}>
              <div className="rounded-full bg-white" style={{ width: 18, height: 18, position: "absolute", top: 3, left: local.travelTime.enabled ? 21 : 3, transition: "left .15s" }} />
            </button>
          </div>
        </Section>

        <Section title="Automatic Payroll Summary">
          <div className="flex items-center justify-between mb-3">
            <div>
              <div className="text-sm" style={{ color: NAVY }}>Send payroll summaries automatically</div>
              <div className="text-xs mt-0.5" style={{ color: SLATE }}>When a pay period closes, send each employee their summary by email/push, and send you a company-wide digest.</div>
            </div>
            <button onClick={() => save({ ...local, payrollSummary: { ...local.payrollSummary, enabled: !local.payrollSummary.enabled } })} className="rounded-full flex-shrink-0" style={{ width: 42, height: 24, background: local.payrollSummary.enabled ? ROYAL : "#D8DEEA", position: "relative", marginLeft: 12 }}>
              <div className="rounded-full bg-white" style={{ width: 18, height: 18, position: "absolute", top: 3, left: local.payrollSummary.enabled ? 21 : 3, transition: "left .15s" }} />
            </button>
          </div>
          {local.payrollSummary.enabled && (
            <>
              <div className="text-xs mb-1" style={{ color: SLATE, fontWeight: 600 }}>When a period closes…</div>
              <div className="flex gap-2 mb-2">
                <button onClick={() => save({ ...local, payrollSummary: { ...local.payrollSummary, mode: "review" } })} className="flex-1 text-xs py-2.5 rounded-lg" style={{ fontWeight: 700, background: local.payrollSummary.mode === "review" ? ROYAL : BG, color: local.payrollSummary.mode === "review" ? "white" : NAVY }}>Review, then send</button>
                <button onClick={() => save({ ...local, payrollSummary: { ...local.payrollSummary, mode: "auto" } })} className="flex-1 text-xs py-2.5 rounded-lg" style={{ fontWeight: 700, background: local.payrollSummary.mode === "auto" ? ROYAL : BG, color: local.payrollSummary.mode === "auto" ? "white" : NAVY }}>Send automatically</button>
              </div>
              <div className="text-xs" style={{ color: SLATE }}>
                {local.payrollSummary.mode === "review"
                  ? "You'll get a notification when a period is ready. Preview it and tap Send when you're happy with the numbers."
                  : "Summaries go out the moment a pay period closes — no approval step."}
              </div>
              <div className="text-xs mt-2" style={{ color: SLATE }}>Only employees with an email on file will receive the email version. Everyone else is simply skipped — no error.</div>
            </>
          )}
        </Section>

        <Section title="Pay Period">
          <div className="grid grid-cols-2 gap-2 mb-2">
            {[{ id: "weekly", label: "Weekly" }, { id: "biweekly", label: "Bi-Weekly" }, { id: "semimonthly", label: "Semi-Monthly" }, { id: "monthly", label: "Monthly" }].map((p) => (
              <button key={p.id} onClick={() => save({ ...local, payPeriod: { ...local.payPeriod, type: p.id } })} className="text-xs py-2 rounded-lg" style={{ fontWeight: 700, background: local.payPeriod.type === p.id ? ROYAL : BG, color: local.payPeriod.type === p.id ? "white" : NAVY }}>{p.label}</button>
            ))}
          </div>
          {local.payPeriod.type === "weekly" && (
            <div className="mb-2">
              <div className="text-xs mb-1" style={{ color: SLATE, fontWeight: 600 }}>Begin every</div>
              <div className="grid grid-cols-4 gap-1.5">
                {[{ v: 1, label: "Mon" }, { v: 2, label: "Tue" }, { v: 3, label: "Wed" }, { v: 4, label: "Thu" }, { v: 5, label: "Fri" }, { v: 6, label: "Sat" }, { v: 0, label: "Sun" }].map((d) => (
                  <button key={d.v} onClick={() => save({ ...local, payPeriod: { ...local.payPeriod, weekStartsOn: d.v } })} className="text-xs py-2 rounded-lg" style={{ fontWeight: 700, background: (local.payPeriod.weekStartsOn === undefined ? 1 : local.payPeriod.weekStartsOn) === d.v ? ROYAL : BG, color: (local.payPeriod.weekStartsOn === undefined ? 1 : local.payPeriod.weekStartsOn) === d.v ? "white" : NAVY }}>{d.label}</button>
                ))}
              </div>
            </div>
          )}
          {local.payPeriod.type === "biweekly" && (
            <div>
              <div className="text-xs mb-1" style={{ color: SLATE, fontWeight: 600 }}>Effective Date — start of a recent pay period, used to line up the 2-week cycle</div>
              <input type="date" value={local.payPeriod.biweeklyAnchor} onChange={(e) => save({ ...local, payPeriod: { ...local.payPeriod, biweeklyAnchor: e.target.value } })} className="w-full px-3 py-2 rounded-lg border text-sm mono" style={{ borderColor: BORDER }} />
            </div>
          )}
        </Section>

        <Section title="Company Profile (shown on payslips)">
          <input value={local.company.name} onChange={(e) => save({ ...local, company: { ...local.company, name: e.target.value } })} placeholder="Company name" className="w-full px-3 py-2 rounded-lg border text-sm mb-2" style={{ borderColor: BORDER }} />
          <input value={local.company.address} onChange={(e) => save({ ...local, company: { ...local.company, address: e.target.value } })} placeholder="Street address" className="w-full px-3 py-2 rounded-lg border text-sm mb-2" style={{ borderColor: BORDER }} />
          <div className="flex gap-2 mb-2">
            <input value={local.company.city} onChange={(e) => save({ ...local, company: { ...local.company, city: e.target.value } })} placeholder="City" className="flex-1 px-3 py-2 rounded-lg border text-sm" style={{ borderColor: BORDER }} />
            <input value={local.company.province} onChange={(e) => save({ ...local, company: { ...local.company, province: e.target.value } })} placeholder="Province / State" className="flex-1 px-3 py-2 rounded-lg border text-sm" style={{ borderColor: BORDER }} />
            <input value={local.company.postal} onChange={(e) => save({ ...local, company: { ...local.company, postal: e.target.value } })} placeholder="Postal / ZIP" className="w-28 px-3 py-2 rounded-lg border text-sm" style={{ borderColor: BORDER }} />
          </div>
          <div className="flex gap-2 mb-2">
            <input value={local.company.phone} onChange={(e) => save({ ...local, company: { ...local.company, phone: e.target.value } })} placeholder="Phone" className="flex-1 px-3 py-2 rounded-lg border text-sm" style={{ borderColor: BORDER }} />
            <input value={local.company.email} onChange={(e) => save({ ...local, company: { ...local.company, email: e.target.value } })} placeholder="Email" className="flex-1 px-3 py-2 rounded-lg border text-sm" style={{ borderColor: BORDER }} />
          </div>
          <div className="text-xs mb-1" style={{ color: SLATE }}>Logo: PNG or JPG, under 500KB, square works best.</div>
          {local.company.logo && <img src={local.company.logo} alt="" style={{ maxHeight: 40, marginBottom: 6 }} />}
          {logoError && <div className="text-xs mb-2" style={{ color: RED }}>{logoError}</div>}
          <button onClick={() => logoRef.current?.click()} className="text-xs px-3 py-2 rounded-lg" style={{ background: BG, color: NAVY, fontWeight: 600 }}>{local.company.logo ? "Change Logo" : "Upload Logo"}</button>
          <input ref={logoRef} type="file" accept="image/png,image/jpeg" capture="environment" onChange={handleLogoFile} className="hidden" />
        </Section>

        <Section title="Tax / Deductions">
          {(local.deductions || []).map((d) => (
            <div key={d.id} className="flex items-center justify-between text-sm mb-1.5 px-3 py-2 rounded-lg" style={{ background: BG }}>
              <div style={{ color: NAVY }}>{d.label} <span className="mono text-xs" style={{ color: SLATE }}>({d.type === "percent" ? d.value + "%" : fmtMoney(d.value, local.currency)})</span></div>
              <button onClick={() => removeDeduction(d.id)} className="text-xs" style={{ color: RED, fontWeight: 600 }}>Remove</button>
            </div>
          ))}
          <div className="flex gap-2 mt-2 flex-wrap">
            <input value={newDedLabel} onChange={(e) => setNewDedLabel(e.target.value)} placeholder="Label (e.g. Federal Tax)" className="flex-1 min-w-[120px] px-3 py-2 rounded-lg border text-sm" style={{ borderColor: BORDER }} />
            <select value={newDedType} onChange={(e) => setNewDedType(e.target.value)} className="px-3 py-2 rounded-lg border text-sm" style={{ borderColor: BORDER }}>
              <option value="percent">%</option>
              <option value="flat">flat</option>
            </select>
            <input value={newDedValue} onChange={(e) => setNewDedValue(e.target.value)} type="number" placeholder="Value" className="w-20 px-3 py-2 rounded-lg border text-sm mono" style={{ borderColor: BORDER }} />
            <button onClick={addDeduction} className="text-sm px-3 py-2 rounded-lg text-white" style={{ background: ROYAL, fontWeight: 600 }}>Add</button>
          </div>
        </Section>

        <Section title="Backup">
          <button onClick={exportBackup} className="w-full text-left text-sm px-4 py-3 rounded-lg mb-2 flex items-center gap-2" style={{ background: BG, color: NAVY, fontWeight: 600 }}>
            <DownloadIcon size={15} color={ROYAL} />Export Backup (JSON)
          </button>
          <button onClick={() => fileRef.current?.click()} className="w-full text-left text-sm px-4 py-3 rounded-lg flex items-center gap-2" style={{ background: BG, color: NAVY, fontWeight: 600 }}>
            <UploadIcon size={15} color={ROYAL} />Import Backup
          </button>
          <input ref={fileRef} type="file" accept="application/json" onChange={handleImportFile} className="hidden" />
        </Section>

        <Section title="Delete Account">
          <div className="text-xs mb-3" style={{ color: SLATE }}>
            Permanently deletes your login, your company, and all crew, timesheet, and payroll data. This cannot be undone. Export a backup first if you want a copy.
          </div>
          {!confirmDelete ? (
            <button onClick={() => setConfirmDelete(true)} className="w-full text-left text-sm px-4 py-3 rounded-lg flex items-center gap-2" style={{ background: BG, color: RED, border: `1px solid ${BORDER}`, fontWeight: 700 }}>
              <TrashIcon size={15} color={RED} />Delete Account
            </button>
          ) : (
            <div className="p-3 rounded-lg" style={{ background: "rgba(239,83,80,0.08)", border: `1px solid ${RED}` }}>
              <div className="text-xs mb-2" style={{ color: NAVY, fontWeight: 600 }}>Type DELETE to confirm — this immediately erases everything.</div>
              <input value={deleteTyped} onChange={(e) => setDeleteTyped(e.target.value)} placeholder="DELETE" className="w-full px-3 py-2 rounded-lg border text-sm mb-2" style={{ borderColor: BORDER, background: CARD, color: NAVY }} />
              {deleteErr && <div className="text-xs mb-2" style={{ color: RED }}>{deleteErr}</div>}
              <div className="flex gap-2">
                <button onClick={handleDeleteAccount} disabled={deleteTyped.trim().toUpperCase() !== "DELETE" || deleting} className="flex-1 text-sm px-4 py-2 rounded-lg text-white" style={{ background: deleteTyped.trim().toUpperCase() === "DELETE" && !deleting ? RED : SLATE, fontWeight: 700 }}>
                  {deleting ? "Deleting…" : "Permanently Delete"}
                </button>
                <button onClick={() => { setConfirmDelete(false); setDeleteTyped(""); setDeleteErr(""); }} className="text-sm px-4 py-2 rounded-lg" style={{ background: CARD, color: NAVY, border: `1px solid ${BORDER}`, fontWeight: 600 }}>Cancel</button>
              </div>
            </div>
          )}
        </Section>

        <button onClick={onClose} className="w-full text-sm px-4 py-2.5 rounded-lg mt-2" style={{ background: NAVY, color: "white", fontWeight: 700 }}>Done</button>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
</body>
</html>
