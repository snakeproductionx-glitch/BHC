function todayStr() { return new Date().toISOString().slice(0, 10); }
function addDays(dateStr, n) {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
}
function getMonday(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  return d.toISOString().slice(0, 10);
}
function getWeekStart(dateStr, weekStartsOn) {
  const wso = weekStartsOn === undefined || weekStartsOn === null ? 1 : weekStartsOn; // 0=Sun..6=Sat, default Monday
  const d = new Date(dateStr + "T00:00:00");
  const day = d.getDay();
  const diff = (day - wso + 7) % 7;
  d.setDate(d.getDate() - diff);
  return d.toISOString().slice(0, 10);
}
function fmtDate(dateStr) {

function fmtDateWeekday(dateStr) {

function fmtRelative(iso) {
  const mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  return `${Math.floor(hrs / 24)}d ago`;
}
function dateRange(start, end) {

}

/* ---- Add-to-Calendar via a downloadable .ics file (works on iOS and Android, no permission needed) ---- */
function icsDate(dateStr) {
  return dateStr.replace(/-/g, "");
}
function downloadICS({ title, date, description }) {
  const dt = icsDate(date);
  const ics = [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//LabourArc//EN",
    "BEGIN:VEVENT",
    `UID:${uid()}@labourarc`,
    `DTSTAMP:${dt}T090000Z`,
    `DTSTART;VALUE=DATE:${dt}`,
    `SUMMARY:${title}`,
    `DESCRIPTION:${(description || "").replace(/\n/g, "\\n")}`,
    "END:VEVENT",
    "END:VCALENDAR",
  ].join("\r\n");
  const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${title.replace(/\s+/g, "_")}.ics`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function requestNotifyPermission() {
  if (!("Notification" in window)) return false;
  if (Notification.permission === "granted") return true;
  const res = await Notification.requestPermission();
  return res === "granted";
}
function showLocalNotification(title, body) {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  try { new Notification(title, { body, icon: "icons/icon-192.png" }); } catch {}
}

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map((c) => c.charCodeAt(0)));
}

async function pushSupported() {
  return "serviceWorker" in navigator && "PushManager" in window;
}

async function subscribeToPush(workspaceId, subscriberType, employeeId) {
  if (!(await pushSupported())) return { ok: false, reason: "unsupported" };
  const granted = await requestNotifyPermission();
  if (!granted) return { ok: false, reason: "denied" };
  try {
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
      });
    }
    await sb.from("push_subscriptions").insert({
      workspace_id: workspaceId,
      subscriber_type: subscriberType,
      employee_id: employeeId || null,
      subscription: sub.toJSON(),
    });
    return { ok: true };
  } catch (e) {
    return { ok: false, reason: String(e) };
  }
}

async function sendPushTo(subscriptions, title, body) {
  for (const row of subscriptions) {
    try {
      await fetch(SEND_PUSH_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + SUPABASE_ANON_KEY,
          apikey: SUPABASE_ANON_KEY,
        },
        body: JSON.stringify({ subscription: row.subscription, title, body }),
      });
    } catch {}
  }
}

    localStorage.setItem("wp_emp_ws_name", ws.name);

  const showLoading = role === "employer" ? (!authChecked || (session && !workspaceChecked) || (workspace && !loaded)) : (role === "employee" && empWorkspaceId && !loaded);

  if (showLoading) {
    return (
      <div style={{ minHeight: "100vh", background: BG, display: "flex", alignItems: "center", justifyContent: "center" }} className="brand" >
        <div style={{ color: NAVY, fontWeight: 800, fontSize: 22 }}>Loading LabourArc…</div>
      </div>
    );
  }

  return (
    <div style={{ minHeight: "100vh", background: BG, fontFamily: "'Inter', sans-serif", display: "flex", flexDirection: "column" }}>
      {error && (
        <div className="px-4 py-2 text-sm text-white text-center" style={{ background: RED }}>
          {error}
        </div>
      )}

      {!role ? (
        <RoleGate setRole={setRolePersist} />
      ) : role === "employer" ? (
        !session ? (
          <EmployerAuthScreen onBack={() => setRolePersist(null)} />
        ) : !workspace ? (
          <CreateWorkspaceScreen session={session} onCreated={setWorkspace} onBack={() => setRolePersist(null)} />
        ) : !employerPinReady(employerPin, employerUnlocked) ? (
          employerPin === null ? (
            <CreatePin
              title="Create Employer PIN"
              subtitle="This protects full access to crew data and payroll on this device."
              pinLength={settings.pinLength}
              onDone={(pin) => { persist("employerPin", pin, setEmployerPin); unlockEmployerRemember(); }}
              onBack={() => setRolePersist(null)}
            />
          ) : (
            <EnterPin
              title="Employer PIN"
              expected={employerPin}
              pinLength={settings.pinLength}
              onSuccess={() => unlockEmployerRemember()}
              onBack={() => setRolePersist(null)}
            />
          )
        ) : (
          <EmployerApp
            employees={employees} entries={entries} dayNotes={dayNotes} paidRanges={paidRanges} deletedLog={deletedLog} employerPin={employerPin} workspace={workspace}
            setEmployees={setEmployees} setEntries={setEntries} setDayNotes={setDayNotes} setPaidRanges={setPaidRanges} setDeletedLog={setDeletedLog} setSettings={setSettings} setEmployerPin={setEmployerPin}
            jobSites={jobSites} settings={settings} activeShifts={activeShifts} setActiveShifts={setActiveShifts} setJobSites={setJobSites} timeOffMarks={timeOffMarks} setTimeOffMarks={setTimeOffMarks}
            sentPayrollSummaries={sentPayrollSummaries} setSentPayrollSummaries={setSentPayrollSummaries}
            persist={persist} switchUser={switchUser} modalOpenRef={modalOpenRef} saving={saving}
          />
        )
      ) : (
        !empWorkspaceId ? (
          <CompanyCodeScreen onJoined={joinWorkspace} onBack={() => setRolePersist(null)} />
        ) : !myEmployeeId ? (
          <EmployeePicker employees={employees} companyName={empWorkspaceName} onPick={setMyIdPersist} onBack={() => { setEmpWorkspaceId(null); localStorage.removeItem("wp_emp_ws_id"); setRolePersist(null); }} />
        ) : (
          (() => {
            const me = employees.find((e) => e.id === myEmployeeId);
            if (!me) return <EmployeePicker employees={employees} companyName={empWorkspaceName} onPick={setMyIdPersist} onBack={() => { setMyIdPersist(null); setRolePersist(null); }} />;
            if (!me.pin) {
              return (
                <CreatePin
                  title={`Create Your PIN, ${me.name}`}
                  subtitle="Only you will use this to see your hours and payroll."
                  pinLength={settings.pinLength}
                  onDone={(pin) => {
                    const next = employees.map((e) => (e.id === me.id ? { ...e, pin } : e));
                    persist("employees", next, setEmployees);
                    unlockEmployeeRemember(me.id);
                  }}
                  onBack={() => setMyIdPersist(null)}
                />
              );
            }
            if (!myUnlocked) {
              return <EnterPin title={`Welcome back, ${me.name}`} expected={me.pin} pinLength={settings.pinLength} onSuccess={() => unlockEmployeeRemember(me.id)} onBack={() => setMyIdPersist(null)} />;
            }
            return (
              <EmployeeApp
                me={me} entries={entries} dayNotes={dayNotes} jobSites={jobSites} settings={settings} workspaceId={activeWorkspaceId} activeShifts={activeShifts} setActiveShifts={setActiveShifts}
                persist={persist} allEntries={entries} switchUser={switchUser} setEntries={setEntries} setDayNotes={setDayNotes} timeOffMarks={timeOffMarks} setTimeOffMarks={setTimeOffMarks}
              />
            );
          })()
        )
      )}

      <Footer />
    </div>
  );
}

function EmployerAuthScreen({ onBack }) {
  const [mode, setMode] = useState("login"); // signup | login | reset
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [info, setInfo] = useState("");

  async function submit() {
    setErr(""); setInfo("");
    if (!email.trim() || password.length < 6) { setErr("Enter a valid email and a password of at least 6 characters."); return; }
    setBusy(true);
    try {
      if (mode === "signup") {
        const { error } = await sb.auth.signUp({ email: email.trim(), password });
        if (error) throw error;
        setInfo("Account created — you're signed in.");
      } else {
        const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password });
        if (error) throw error;
      }
    } catch (e) {
      setErr(e.message || "Something went wrong.");
    } finally {
      setBusy(false);
    }
  }

  async function sendReset() {
    setErr(""); setInfo("");
    if (!email.trim()) { setErr("Enter the email on your account first."); return; }
    setBusy(true);
    try {
      const { error } = await sb.auth.resetPasswordForEmail(email.trim(), { redirectTo: window.location.href });
      if (error) throw error;
      setInfo("Check your email for a password reset link.");
    } catch (e) {
      setErr(e.message || "Couldn't send the reset email.");
    } finally {
      setBusy(false);
    }
  }

  if (mode === "reset") {
    return (
      <div className="flex-1 flex flex-col">
        <BrandHeader right={<button onClick={onBack} className="text-sm" style={{ color: SLATE }}>Back</button>} />

          </div>
        </div>

  return (

      <BrandHeader right={<button onClick={onBack} className="text-sm" style={{ color: SLATE }}>Back</button>} />
      <div className="flex-1 flex flex-col items-center justify-center px-6">
        <div className="w-full max-w-xs">
          <div className="flex gap-2 mb-5">
            <button onClick={() => setMode("login")} className="flex-1 py-2 rounded-lg text-sm" style={{ fontWeight: 700, background: mode === "login" ? ROYAL : BG, color: mode === "login" ? "white" : NAVY }}>Log In</button>
            <button onClick={() => setMode("signup")} className="flex-1 py-2 rounded-lg text-sm" style={{ fontWeight: 700, background: mode === "signup" ? ROYAL : BG, color: mode === "signup" ? "white" : NAVY }}>Sign Up</button>
          </div>
          <div className="brand text-lg mb-4 text-center" style={{ color: NAVY, fontWeight: 800 }}>
            {mode === "signup" ? "Create Your Employer Account" : "Welcome Back"}
          </div>
          {err && <div className="text-xs mb-3 text-center" style={{ color: RED }}>{err}</div>}
          {info && <div className="text-xs mb-3 text-center" style={{ color: GREEN }}>{info}</div>}

          {mode === "login" && (
            <button onClick={() => { setMode("reset"); setErr(""); setInfo(""); }} className="text-xs mb-3" style={{ color: ROYAL, fontWeight: 600 }}>Forgot password?</button>

function CreateWorkspaceScreen({ session, onCreated, onBack }) {
  const [name, setName] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  function genCode() {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let out = "";
    for (let i = 0; i < 6; i++) out += chars[Math.floor(Math.random() * chars.length)];
    return out;
  }

  async function create() {
    if (!name.trim()) { setErr("Enter your company name."); return; }
    setBusy(true); setErr("");
    let attempts = 0;
    while (attempts < 5) {
      const code = genCode();
      const { data, error } = await sb.from("workspaces").insert({ owner_id: session.user.id, name: name.trim(), company_code: code }).select("id,name,company_code").single();
      if (!error) { onCreated(data); return; }
      if (!String(error.message).includes("duplicate")) { setErr(error.message); setBusy(false); return; }
      attempts++;
    }
    setErr("Couldn't create a unique company code — try again.");
    setBusy(false);
  }

  return (
    <div className="flex-1 flex flex-col">
      <BrandHeader right={<button onClick={onBack} className="text-sm" style={{ color: SLATE }}>Back</button>} />
      <div className="flex-1 flex flex-col items-center justify-center px-6">
        <div className="w-full max-w-xs">
          <div className="brand text-lg mb-2 text-center" style={{ color: NAVY, fontWeight: 800 }}>Set Up Your Company</div>
          <div className="text-sm text-center mb-4" style={{ color: SLATE }}>This creates your own private LabourArc workspace.</div>
          {err && <div className="text-xs mb-3 text-center" style={{ color: RED }}>{err}</div>}
          <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Company name" className="w-full px-3 py-3 rounded-lg border text-sm mb-4" style={{ borderColor: BORDER }} />
          <button onClick={create} disabled={busy} className="w-full py-3 rounded-lg text-white text-sm" style={{ background: ROYAL, fontWeight: 700 }}>
            {busy ? "Creating…" : "Create Workspace"}
          </button>
        </div>
      </div>
    </div>
  );
}

function CreatePin({ title, subtitle, onDone, onBack, inline, pinLength = 6 }) {
  const [step, setStep] = useState(1);
  const [first, setFirst] = useState("");
  const [val, setVal] = useState("");
  const [err, setErr] = useState("");

  function handleChange(v) {
    const digits = v.replace(/\D/g, "").slice(0, pinLength);
    setVal(digits);
    if (digits.length === pinLength) {
      if (step === 1) {
        setFirst(digits);
        setVal("");
        setStep(2);
      } else {
        if (digits === first) {
          onDone(digits);
        } else {
          setErr("PINs didn't match — try again.");
          setFirst("");
          setVal("");
          setStep(1);
        }
      }
    }
  }

  const body = (
    <div className="flex flex-col items-center">
      {!inline && <LockIcon size={28} color={ROYAL} />}
      <div className={inline ? "text-sm mb-1 text-center" : "brand text-xl mt-3 mb-1 text-center"} style={{ color: NAVY, fontWeight: 800 }}>{title}</div>
      {subtitle && <div className="text-sm text-center mb-2 max-w-xs" style={{ color: SLATE }}>{subtitle}</div>}
      <div className="text-xs mb-4" style={{ color: ROYAL, fontWeight: 600 }}>{step === 1 ? `Enter a ${pinLength}-digit PIN` : "Confirm your PIN"}</div>
      {err && <div className="text-xs mb-3" style={{ color: RED }}>{err}</div>}
      <PinDots value={val} length={pinLength} />
      <input
        autoFocus
        type="tel"
        inputMode="numeric"
        value={val}
        onChange={(e) => handleChange(e.target.value)}
        className="opacity-0 absolute"
        style={{ width: 1, height: 1 }}
        id={inline ? "inline-pin-input" : undefined}
      />
      <button onClick={() => document.getElementById(inline ? "inline-pin-input" : undefined)?.focus() || document.querySelector('input[type=tel]')?.focus()} className="text-xs px-4 py-2 rounded-lg" style={{ background: CARD, border: `1px solid ${BORDER}`, color: SLATE }}>
        Tap here to type
      </button>
      {inline && <button onClick={onBack} className="text-xs mt-3" style={{ color: SLATE }}>Cancel</button>}
    </div>
  );

  if (inline) return <div className="py-2">{body}</div>;

  return (
    <div className="flex-1 flex flex-col">
      <BrandHeader right={<button onClick={onBack} className="text-sm" style={{ color: SLATE }}>Back</button>} />
      <div className="flex-1 flex flex-col items-center justify-center px-6">
        {body}
      </div>
    </div>
  );
}

function EnterPin({ title, expected, onSuccess, onBack, pinLength = 6 }) {
  const [val, setVal] = useState("");
  const [err, setErr] = useState("");
  const [bioAvailable, setBioAvailable] = useState(false);

  useEffect(() => { biometricAvailable().then(setBioAvailable); }, []);

  function handleChange(v) {
    const digits = v.replace(/\D/g, "").slice(0, pinLength);
    setVal(digits);
    setErr("");
    if (digits.length === pinLength) {
      if (digits === expected) {
        onSuccess();
      } else {
        setErr("Incorrect PIN — try again.");
        setTimeout(() => setVal(""), 400);
      }
    }
  }

  async function tryBiometric() {
    const ok = await biometricPrompt();
    if (ok) onSuccess();
    else setErr("Face ID / Touch ID wasn't confirmed — enter your PIN instead.");
  }

  return (
    <div className="flex-1 flex flex-col">
      <BrandHeader right={<button onClick={onBack} className="text-sm" style={{ color: SLATE }}>Back</button>} />
      <div className="flex-1 flex flex-col items-center justify-center px-6">
        <LockIcon size={28} color={ROYAL} />
        <div className="brand text-xl mt-3 mb-4 text-center" style={{ color: NAVY, fontWeight: 800 }}>{title}</div>
        {err && <div className="text-xs mb-3" style={{ color: RED }}>{err}</div>}
        <PinDots value={val} length={pinLength} />
        <input
          autoFocus
          type="tel"
          inputMode="numeric"
          value={val}
          onChange={(e) => handleChange(e.target.value)}
          className="opacity-0 absolute"
          style={{ width: 1, height: 1 }}
        />
        <button onClick={() => document.querySelector('input[type=tel]')?.focus()} className="text-xs px-4 py-2 rounded-lg mb-3" style={{ background: CARD, border: `1px solid ${BORDER}`, color: SLATE }}>
          Tap here to type
        </button>
        {bioAvailable && (
          <button onClick={tryBiometric} className="text-xs px-4 py-2 rounded-lg flex items-center gap-1.5" style={{ background: BG, color: ROYAL, fontWeight: 700 }}>
            <LockIcon size={13} />Use Face ID / Touch ID instead
          </button>
        )}
      </div>
    </div>
  );
}

/* ================= EMPLOYER APP ================= */

function EmployerApp({ employees, entries, dayNotes, paidRanges, deletedLog, employerPin, workspace, jobSites, settings, persist, switchUser, modalOpenRef, saving, activeShifts, setActiveShifts, setEmployees, setEntries, setDayNotes, setPaidRanges, setDeletedLog, setJobSites, setSettings, setEmployerPin, timeOffMarks, setTimeOffMarks, sentPayrollSummaries, setSentPayrollSummaries }) {
  const [tab, setTab] = useState("log");
  const [empSearch, setEmpSearch] = useState("");
  const [logSearch, setLogSearch] = useState("");

  const [empName, setEmpName] = useState("");
  const [empRate, setEmpRate] = useState("");
  const [editingEmpId, setEditingEmpId] = useState(null);
  const [editName, setEditName] = useState("");
  const [editRate, setEditRate] = useState("");

  const [logEmpIds, setLogEmpIds] = useState([]);
  const [logDate, setLogDate] = useState(todayStr());
  const [logHours, setLogHours] = useState("");
  const [editingEntryId, setEditingEntryId] = useState(null);
  const [editHours, setEditHours] = useState("");

  const [rangeStart, setRangeStart] = useState(getMonday(todayStr()));
  const [rangeEnd, setRangeEnd] = useState(todayStr());

  const [noteCell, setNoteCell] = useState(null);
  const [payslipEmp, setPayslipEmp] = useState(null);
  const [bulkPayslip, setBulkPayslip] = useState(false);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [contactOpen, setContactOpen] = useState(false);
  const [detailEmpId, setDetailEmpId] = useState(null);
  const [detailSiteId, setDetailSiteId] = useState(null);
  const [reviewPayrollOpen, setReviewPayrollOpen] = useState(false);
  const [reportsOpen, setReportsOpen] = useState(false);

  const [siteName, setSiteName] = useState("");
  const [siteAddress, setSiteAddress] = useState("");
  const [logSiteId, setLogSiteId] = useState("");

  useEffect(() => {
    modalOpenRef.current = !!(noteCell || payslipEmp || bulkPayslip || settingsOpen || contactOpen || detailEmpId || detailSiteId || reportsOpen);
  }, [noteCell, payslipEmp, bulkPayslip, settingsOpen, contactOpen, detailEmpId, detailSiteId, reportsOpen]);

  function addSite() {
    if (!siteName.trim()) return;
    persist("jobSites", [...jobSites, { id: uid(), name: siteName.trim(), address: siteAddress.trim() }], setJobSites);
    setSiteName(""); setSiteAddress("");
  }
  function removeSite(id) {
    persist("jobSites", jobSites.filter((s) => s.id !== id), setJobSites);
  }
  function saveSitesLocal(next) { persist("jobSites", next, setJobSites); }
  function siteSpend(siteId) {
    return entries.filter((t) => t.siteId === siteId).reduce((sum, t) => {
      const emp = employees.find((e) => e.id === t.employeeId);
      return sum + (emp ? t.hours * emp.rate : 0);
    }, 0);
  }
  function siteHours(siteId) {
    return entries.filter((t) => t.siteId === siteId).reduce((s, t) => s + t.hours, 0);
  }
  function siteCrewIds(siteId) {
    return [...new Set(entries.filter((t) => t.siteId === siteId).map((t) => t.employeeId))];
  }

  function addEmployee() {
    if (!empName.trim() || !empRate || Number(empRate) <= 0) return;
    persist("employees", [...employees, { id: uid(), name: empName.trim(), rate: Number(empRate), pin: null }], setEmployees);
    setEmpName(""); setEmpRate("");
  }
  function saveEmployeesLocal(next) { persist("employees", next, setEmployees); }
  function saveEntriesLocal(next) { persist("entries", next, setEntries); }
  function saveNotesLocal(next) { persist("dayNotes", next, setDayNotes); }
  function savePaidLocal(next) { persist("paidRanges", next, setPaidRanges); }
  function saveLogLocal(next) { persist("deletedLog", next, setDeletedLog); }

  function startEditEmp(e) { setEditingEmpId(e.id); setEditName(e.name); setEditRate(String(e.rate)); }
  function saveEditEmp(id) {
    if (!editName.trim() || !editRate || Number(editRate) <= 0) return;
    saveEmployeesLocal(employees.map((e) => (e.id === id ? { ...e, name: editName.trim(), rate: Number(editRate) } : e)));
    setEditingEmpId(null);
  }
  function resetEmpPin(id) {
    saveEmployeesLocal(employees.map((e) => (e.id === id ? { ...e, pin: null } : e)));
  }
  function removeEmployee(id) {
    const emp = employees.find((e) => e.id === id);
    if (!emp) return;
    const related = entries.filter((t) => t.employeeId === id);
    const logId = uid();
    saveLogLocal([{ id: logId, type: "employee", label: emp.name, deletedAt: new Date().toISOString(), payload: { employee: emp, entries: related } }, ...deletedLog]);
    saveEmployeesLocal(employees.filter((e) => e.id !== id));
    saveEntriesLocal(entries.filter((t) => t.employeeId !== id));
  }

  function toggleLogEmp(id) { setLogEmpIds((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id])); }
  function toggleLogEmpAll() { setLogEmpIds((prev) => (prev.length === filteredEmployees.length ? [] : filteredEmployees.map((e) => e.id))); }
  function addEntry() {
    if (logEmpIds.length === 0 || !logDate || !logHours || Number(logHours) <= 0) return;
    haptic(15);
    const newEntries = logEmpIds.map((id) => ({ id: uid(), employeeId: id, date: logDate, hours: Number(logHours), siteId: logSiteId || null }));
    saveEntriesLocal([...entries, ...newEntries]);
    setLogHours(""); setLogEmpIds([]); setLogSiteId("");
  }
  function startEditEntry(t) { setEditingEntryId(t.id); setEditHours(String(t.hours)); }
  function saveEditEntry(id) {
    if (!editHours || Number(editHours) <= 0) return;
    saveEntriesLocal(entries.map((t) => (t.id === id ? { ...t, hours: Number(editHours) } : t)));
    setEditingEntryId(null);
  }
  function removeEntry(id) {
    const entry = entries.find((t) => t.id === id);
    if (!entry) return;
    const emp = employees.find((e) => e.id === entry.employeeId);
    const logId = uid();
    saveLogLocal([{ id: logId, type: "entry", label: `${emp ? emp.name : "Unknown"} · ${fmtDate(entry.date)} · ${entry.hours}h`, deletedAt: new Date().toISOString(), payload: entry }, ...deletedLog]);
    saveEntriesLocal(entries.filter((t) => t.id !== id));
  }
  function restoreItem(logId) {
    const item = deletedLog.find((d) => d.id === logId);
    if (!item) return;
    if (item.type === "employee") {
      saveEmployeesLocal([...employees, item.payload.employee]);
      saveEntriesLocal([...entries, ...item.payload.entries]);
    } else {
      saveEntriesLocal([...entries, item.payload]);
    }
    saveLogLocal(deletedLog.filter((d) => d.id !== logId));
  }
  function purgeHistoryItem(logId) { saveLogLocal(deletedLog.filter((d) => d.id !== logId)); }

  function setPreset(preset) {
    const t = todayStr();
    if (preset === "thisWeek") { setRangeStart(getMonday(t)); setRangeEnd(t); }
    else if (preset === "lastWeek") { const lm = addDays(getMonday(t), -7); setRangeStart(lm); setRangeEnd(addDays(lm, 6)); }
    else if (preset === "last30") { setRangeStart(addDays(t, -29)); setRangeEnd(t); }
  }

  const filteredEmployees = useMemo(
    () => employees.filter((e) => e.name.toLowerCase().includes(empSearch.toLowerCase())),
    [employees, empSearch]
  );
  const filteredEntries = useMemo(() => {
    const sorted = [...entries].sort((a, b) => (a.date < b.date ? 1 : -1));
    if (!logSearch.trim()) return sorted;
    const q = logSearch.toLowerCase();
    return sorted.filter((t) => {
      const emp = employees.find((e) => e.id === t.employeeId);
      return (emp && emp.name.toLowerCase().includes(q)) || t.date.includes(q);
    });
  }, [entries, employees, logSearch]);

  const days = useMemo(() => (rangeStart && rangeEnd && rangeStart <= rangeEnd ? dateRange(rangeStart, rangeEnd) : []), [rangeStart, rangeEnd]);
  const gridHours = useMemo(() => {
    const map = {};
    for (const t of entries) {
      if (t.date < rangeStart || t.date > rangeEnd) continue;
      const key = t.employeeId + "|" + t.date;
      map[key] = (map[key] || 0) + t.hours;
    }
    return map;
  }, [entries, rangeStart, rangeEnd]);
  const empRangeTotals = useMemo(() => employees.map((e) => {
    const calc = calcPay(e, days, gridHours, settings);
    return { ...e, hours: calc.totalHours, regularHours: calc.regularHours, overtimeHours: calc.overtimeHours, pay: calc.gross, deductionLines: calc.deductionLines, totalDeductions: calc.totalDeductions, net: calc.net };
  }), [employees, days, gridHours, settings]);
  const dayTotals = useMemo(() => days.map((d) => {
    let hours = 0;
    for (const e of employees) hours += gridHours[e.id + "|" + d] || 0;
    return hours;
  }), [days, employees, gridHours]);
  const grandTotalHours = empRangeTotals.reduce((s, e) => s + e.hours, 0);
  const grandTotalPay = empRangeTotals.reduce((s, e) => s + e.pay, 0);

  function togglePaid(employeeId) {
    haptic(20);
    const key = `${employeeId}|${rangeStart}|${rangeEnd}`;
    const next = { ...paidRanges };
    const wasPaid = !!next[key];
    if (wasPaid) delete next[key]; else next[key] = true;
    savePaidLocal(next);
    if (!wasPaid && workspace) {
      const emp = employees.find((e) => e.id === employeeId);
      notifyEmployee(workspace.id, employeeId, "Payroll Paid", `Your pay for ${rangeStart} to ${rangeEnd} has been marked as paid${emp ? ", " + emp.name : ""}.`);
    }
  }
  function saveNote(employeeId, date, text) {
    const key = employeeId + "|" + date;
    const next = { ...dayNotes };
    if (text.trim()) next[key] = text.trim(); else delete next[key];
    saveNotesLocal(next);
  }

  const tabs = [
    { id: "log", label: "Time Log", icon: ClockIcon },
    { id: "crew", label: "Crew", icon: UsersIcon },
    { id: "sites", label: "Sites", icon: MapPinIcon },
    { id: "sheet", label: "Timesheet", icon: CalendarIcon },
    { id: "payroll", label: "Payroll", icon: DollarIcon },
    { id: "history", label: "History", icon: HistoryIcon },
  ];

  return (
    <div className="flex-1 flex flex-col">
      <div className="no-print" style={{ background: DARK }}>
        <div className="stripe-divider" />
        <div className="max-w-4xl mx-auto px-5 pt-6 pb-4">
          <div className="flex items-center justify-between">
            <img src="icons/labourarc-logo.png" alt="LabourArc" style={{ height: 34, objectFit: "contain" }} />
            <div className="flex items-center gap-3">
              {saving && <span className="text-xs" style={{ color: SLATE }}>Saving…</span>}
              <button onClick={() => setReportsOpen(true)} style={{ color: "#C7CBD1" }}><BarChartIcon size={19} /></button>
              <button onClick={() => setSettingsOpen(true)} style={{ color: "#C7CBD1" }}><GearIcon size={20} /></button>
            </div>
          </div>
          <div className="mono text-xs mt-1" style={{ color: SLATE, letterSpacing: "0.15em" }}>EMPLOYER DASHBOARD</div>
          <div className="flex gap-2 mt-5 border-b" style={{ borderColor: BORDER }}>
            {tabs.map((t) => {
              const active = tab === t.id;
              return (
                <button key={t.id} onClick={() => setTab(t.id)} className="brand pb-3 flex-1 text-center" style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.01em", color: active ? ROYAL : SLATE, borderBottom: `2px solid ${active ? ROYAL : "transparent"}`, whiteSpace: "nowrap" }}>
                  {t.label}
                </button>
              );
            })}
          </div>
        </div>
      </div>

      <div className="max-w-4xl mx-auto px-5 py-6 no-print w-full flex-1">
        {tab === "crew" && (
          <div>
            <Card icon={UsersIcon} title="Add Crew Member">
              <div className="flex gap-2 flex-wrap">
                <input value={empName} onChange={(e) => setEmpName(e.target.value)} placeholder="Name" className="flex-1 min-w-[140px] px-3 py-2 rounded-lg border text-sm" style={{ borderColor: BORDER }} />
                <input value={empRate} onChange={(e) => setEmpRate(e.target.value)} placeholder="Hourly rate" type="number" className="w-32 px-3 py-2 rounded-lg border text-sm mono" style={{ borderColor: BORDER }} />
                <button onClick={addEmployee} className="text-sm px-4 py-2 rounded-lg text-white" style={{ background: ROYAL, fontWeight: 600 }}>Add</button>
              </div>
            </Card>
            <SearchBar value={empSearch} onChange={setEmpSearch} placeholder="Search crew…" />
            {filteredEmployees.length === 0 ? <Empty text="No crew found." /> : (
              <div className="space-y-2">
                {filteredEmployees.map((e) => {
                  const shift = activeShifts && activeShifts[e.id];
                  if (editingEmpId === e.id) {
                    return (
                      <Row key={e.id}>
                        <div className="flex gap-2 flex-1 items-center flex-wrap">
                          <input value={editName} onChange={(ev) => setEditName(ev.target.value)} className="flex-1 min-w-[100px] px-2 py-1.5 rounded-lg border text-sm" style={{ borderColor: BORDER, background: BG, color: NAVY }} />
                          <input value={editRate} onChange={(ev) => setEditRate(ev.target.value)} type="number" className="w-24 px-2 py-1.5 rounded-lg border text-sm mono" style={{ borderColor: BORDER, background: BG, color: NAVY }} />
                          <button onClick={() => saveEditEmp(e.id)} className="text-xs px-3 py-1.5 rounded-lg text-white" style={{ background: GREEN, fontWeight: 600 }}>Save</button>
                          <button onClick={() => setEditingEmpId(null)} className="text-xs px-2 py-1.5" style={{ color: SLATE }}>Cancel</button>
                        </div>
                      </Row>
                    );
                  }
                  return (
                    <div key={e.id} onClick={() => setDetailEmpId(e.id)} className="flex items-center gap-3 px-4 py-3 rounded-xl shadow-sm mb-2 relative overflow-hidden cursor-pointer" style={{ background: CARD, border: `1px solid ${BORDER}` }}>
                      <div style={{ position: "absolute", top: 0, left: 0, width: 3, height: "100%", background: shift ? GREEN : ROYAL }} />
                      <div style={{ marginLeft: 6 }}>
                        <Avatar name={e.name} size={44} ring={shift ? GREEN : ROYAL} />
                      </div>
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ fontWeight: 600, color: NAVY }}>{e.name}</div>
                        <div className="mono text-xs flex items-center gap-1.5 flex-wrap" style={{ color: SLATE }}>
                          <span>{fmtMoney(e.rate)}/hr</span>
                          {e.pin ? <span style={{ color: GREEN }}>· PIN set</span> : <span>· No PIN yet</span>}
                        </div>
                      </div>
                      {shift ? (
                        <div className="text-right flex-shrink-0">
                          <div className="flex items-center gap-1 justify-end mb-1">
                            <span style={{ width: 6, height: 6, borderRadius: "50%", background: GREEN, display: "inline-block" }} />
                            <span className="mono text-xs" style={{ color: GREEN, fontWeight: 700 }}>{new Date(shift.startedAt).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}</span>
                          </div>
                          <span className="mono text-xs px-2 py-0.5 rounded" style={{ background: "rgba(111,207,151,0.15)", color: GREEN, fontWeight: 700 }}>On Site</span>
                        </div>
                      ) : (
                        <div style={{ color: SLATE, flexShrink: 0 }}>›</div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}

        {tab === "log" && (
          <div>
            {(() => {
              if (!settings.payrollSummary || !settings.payrollSummary.enabled || settings.payrollSummary.mode !== "review") return null;
              const closed = getPayPeriodRange(settings.payPeriod, "previous");
              if (closed.end > todayStr()) return null; // period hasn't actually ended yet
              if ((sentPayrollSummaries || []).includes(closed.end)) return null; // already sent
              const days = dateRange(closed.start, closed.end);
              const gh = {};
              for (const t of entries) { if (t.date >= closed.start && t.date <= closed.end) gh[t.employeeId + "|" + t.date] = (gh[t.employeeId + "|" + t.date] || 0) + t.hours; }
              const total = employees.reduce((s, e) => s + calcPay(e, days, gh, settings).net, 0);
              return (
                <div onClick={() => setReviewPayrollOpen(true)} className="p-4 rounded-xl mb-4 shadow-sm relative overflow-hidden cursor-pointer" style={{ background: CARD, border: `1px solid ${ROYAL}` }}>
                  <div style={{ position: "absolute", top: 0, left: 0, width: 4, height: "100%", background: ROYAL }} />
                  <div style={{ paddingLeft: 6 }} className="flex items-center justify-between">
                    <div>
                      <div className="brand text-sm" style={{ color: NAVY, fontWeight: 700, letterSpacing: "0.02em" }}>PAYROLL PERIOD READY</div>
                      <div className="text-xs mt-1" style={{ color: SLATE }}>{fmtDateWeekday(closed.start)} – {fmtDateWeekday(closed.end)} · {employees.length} employees · {fmtMoney(total, settings.currency)} total</div>
                    </div>
                    <button className="text-xs px-3 py-2 rounded-lg text-white flex-shrink-0" style={{ background: ROYAL, fontWeight: 700 }}>Review</button>
                  </div>
                </div>
              );
            })()}
            <DashboardOverview employees={employees} entries={entries} jobSites={jobSites} activeShifts={activeShifts} settings={settings} timeOffMarks={timeOffMarks} />
            <Card icon={ClockIcon} title="Log Hours">
              {employees.length === 0 ? <div className="text-sm" style={{ color: SLATE }}>Add crew members first.</div> : (
                <div>
                  <div className="flex items-center justify-between mb-2">
                    <div className="text-xs" style={{ color: SLATE, fontWeight: 600 }}>Select workers</div>
                    <button onClick={toggleLogEmpAll} className="text-xs" style={{ color: ROYAL, fontWeight: 600 }}>{logEmpIds.length === employees.length ? "Clear all" : "Select all"}</button>
                  </div>
                  <div className="flex flex-wrap gap-2 mb-3">
                    {employees.map((e) => {
                      const active = logEmpIds.includes(e.id);
                      return (
                        <button key={e.id} onClick={() => toggleLogEmp(e.id)} className="text-sm px-3 py-1.5 rounded-full" style={{ fontWeight: 600, background: active ? ROYAL : BG, color: active ? "white" : NAVY, border: `1px solid ${active ? ROYAL : BORDER}` }}>
                          {active ? "✓ " : ""}{e.name}
                        </button>
                      );
                    })}
                  </div>
                  <div className="flex gap-2 flex-wrap">
                    <input type="date" value={logDate} onChange={(e) => setLogDate(e.target.value)} className="px-3 py-2 rounded-lg border text-sm mono" style={{ borderColor: BORDER }} />
                    <input type="number" value={logHours} onChange={(e) => setLogHours(e.target.value)} placeholder="Hours" className="w-24 px-3 py-2 rounded-lg border text-sm mono" style={{ borderColor: BORDER }} />
                    {jobSites.length > 0 && (
                      <select value={logSiteId} onChange={(e) => setLogSiteId(e.target.value)} className="px-3 py-2 rounded-lg border text-sm" style={{ borderColor: BORDER }}>
                        <option value="">No site</option>
                        {jobSites.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
                      </select>
                    )}
                    <button onClick={addEntry} disabled={logEmpIds.length === 0} className="text-sm px-4 py-2 rounded-lg text-white" style={{ background: logEmpIds.length === 0 ? SLATE : ROYAL, fontWeight: 600 }}>
                      Log ({logEmpIds.length || 0})
                    </button>
                  </div>
                </div>
              )}
            </Card>
            <SearchBar value={logSearch} onChange={setLogSearch} placeholder="Search by name or date…" />
            {filteredEntries.length === 0 ? <Empty text="No hours logged yet." /> : (
              <div className="space-y-2">
                {filteredEntries.map((t) => {
                  const emp = employees.find((e) => e.id === t.employeeId);
                  return (
                    <Row key={t.id}>
                      <div className="flex items-center gap-3">
                        <div className="mono text-xs px-2 py-1 rounded" style={{ background: BG, color: NAVY }}>{fmtDate(t.date)}</div>
                        <div style={{ fontWeight: 600, color: NAVY }}>{emp ? emp.name : "Unknown"}</div>
                      </div>
                      <div className="flex items-center gap-3">
                        {editingEntryId === t.id ? (
                          <>
                            <input value={editHours} onChange={(e) => setEditHours(e.target.value)} type="number" className="w-16 px-2 py-1 rounded-lg border text-sm mono" style={{ borderColor: BORDER }} />
                            <button onClick={() => saveEditEntry(t.id)} className="text-xs" style={{ color: GREEN, fontWeight: 700 }}>Save</button>
                            <button onClick={() => setEditingEntryId(null)} className="text-xs" style={{ color: SLATE }}>Cancel</button>
                          </>
                        ) : (
                          <>
                            <div className="mono text-sm" style={{ color: ROYAL, fontWeight: 700 }}>{t.hours}h</div>
                            <button onClick={() => startEditEntry(t)} style={{ color: ROYAL }}><EditIcon size={14} /></button>
                            <button onClick={() => removeEntry(t.id)} className="text-xs" style={{ color: RED, fontWeight: 600 }}>Delete</button>
                          </>
                        )}
                      </div>
                    </Row>
                  );
                })}
              </div>
            )}
          </div>
        )}

        {tab === "sites" && (
          <div>
            <Card icon={MapPinIcon} title="Add Job Site">
              <div className="flex gap-2 flex-wrap">
                <input value={siteName} onChange={(e) => setSiteName(e.target.value)} placeholder="Site name" className="flex-1 min-w-[120px] px-3 py-2 rounded-lg border text-sm" style={{ borderColor: BORDER }} />
                <input value={siteAddress} onChange={(e) => setSiteAddress(e.target.value)} placeholder="Address (optional)" className="flex-1 min-w-[120px] px-3 py-2 rounded-lg border text-sm" style={{ borderColor: BORDER }} />
                <button onClick={addSite} className="text-sm px-4 py-2 rounded-lg text-white" style={{ background: ROYAL, fontWeight: 600 }}>Add</button>
              </div>
            </Card>
            {jobSites.length === 0 ? <Empty text="No job sites yet." /> : (
              <div className="space-y-2">
                {jobSites.map((s) => {
                  const spend = siteSpend(s.id);
                  const budget = Number(s.budget) || 0;
                  const pct = budget > 0 ? Math.min(100, Math.round((spend / budget) * 100)) : null;
                  const phase = Number(s.progress) || 0;
                  return (
                    <div key={s.id} className="p-4 rounded-xl mb-2 shadow-sm relative overflow-hidden cursor-pointer" style={{ background: CARD, border: `1px solid ${BORDER}` }} onClick={() => setDetailSiteId(s.id)}>
                      <div style={{ position: "absolute", top: 0, left: 0, width: 4, height: "100%", background: ROYAL }} />
                      <div className="flex items-center justify-between" style={{ paddingLeft: 6 }}>
                        <div>
                          <div style={{ fontWeight: 600, color: NAVY }}>{s.name}</div>
                          {s.address && <div className="text-xs" style={{ color: SLATE }}>{s.address}</div>}
                        </div>
                        <button onClick={(ev) => { ev.stopPropagation(); removeSite(s.id); }} className="text-xs" style={{ color: RED, fontWeight: 600 }}>Remove</button>
                      </div>
                      {(budget > 0 || phase > 0) && (
                        <div style={{ paddingLeft: 6, marginTop: 10 }}>
                          {phase > 0 && (
                            <div className="mb-2">
                              <div className="flex justify-between mono text-xs mb-1" style={{ color: SLATE, fontWeight: 700 }}><span>PROGRESS</span><span>{phase}%</span></div>
                              <div className="rounded" style={{ height: 6, background: BG, border: `1px solid ${BORDER}`, overflow: "hidden" }}>
                                <div style={{ height: "100%", width: phase + "%", background: ROYAL }} />
                              </div>
                            </div>
                          )}
                          {budget > 0 && (
                            <div className="mono text-xs" style={{ color: pct >= 100 ? RED : SLATE }}>
                              {fmtMoney(spend)} of {fmtMoney(budget)} labor budget spent ({pct}%)
                            </div>
                          )}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}

        {tab === "sheet" && (
          <div>
            <DateRangeBar rangeStart={rangeStart} rangeEnd={rangeEnd} setRangeStart={setRangeStart} setRangeEnd={setRangeEnd} setPreset={setPreset} />
            <div className="text-xs mb-3 flex items-center gap-1.5" style={{ color: SLATE }}><NoteIcon size={13} />Tap any cell to add a note for that day.</div>
            {employees.length === 0 || days.length === 0 ? <Empty text="Add crew and pick a valid date range." /> : (
              <div className="overflow-x-auto rounded-xl shadow-sm" style={{ border: `1px solid ${BORDER}`, background: CARD }}>
                <table className="w-full text-sm" style={{ borderCollapse: "collapse" }}>
                  <thead>
                    <tr style={{ background: NAVY }}>
                      <th className="text-left px-3 py-2.5 text-xs" style={{ color: "white", fontWeight: 600, position: "sticky", left: 0, background: NAVY }}>Date</th>
                      {employees.map((e) => <th key={e.id} className="text-right px-3 py-2.5 text-xs whitespace-nowrap" style={{ color: "white", fontWeight: 600 }}>{e.name}</th>)}
                      <th className="text-right px-3 py-2.5 text-xs" style={{ color: ROYAL_L, fontWeight: 700 }}>Total</th>
                    </tr>
                  </thead>
                  <tbody>
                    {days.map((d, i) => (
                      <tr key={d} style={{ borderTop: `1px solid ${BORDER}` }}>
                        <td className="mono px-3 py-2 text-xs whitespace-nowrap" style={{ color: NAVY, position: "sticky", left: 0, background: CARD, fontWeight: 600 }}>{fmtDateWeekday(d)}</td>
                        {employees.map((e) => {
                          const h = gridHours[e.id + "|" + d] || 0;
                          const hasNote = !!dayNotes[e.id + "|" + d];
                          return (
                            <td key={e.id} className="text-right px-1 py-1">
                              <button onClick={() => setNoteCell({ employeeId: e.id, date: d })} className="relative mono w-full text-right px-2 py-1.5 rounded-lg" style={{ color: h ? ROYAL : SLATE, background: hasNote ? "rgba(255,107,26,0.15)" : "transparent" }}>
                                {h ? h : "–"}
                                {hasNote && <span className="absolute rounded-full" style={{ top: 3, right: 3, width: 5, height: 5, background: ROYAL }} />}
                              </button>
                            </td>
                          );
                        })}
                        <td className="mono text-right px-3 py-2" style={{ color: ROYAL, fontWeight: 700 }}>{dayTotals[i] || "–"}</td>
                      </tr>
                    ))}
                  </tbody>
                  <tfoot>
                    <tr style={{ borderTop: `2px solid ${NAVY}`, background: BG }}>
                      <td className="px-3 py-2.5 text-xs" style={{ color: NAVY, fontWeight: 700, position: "sticky", left: 0, background: BG }}>Total</td>
                      {empRangeTotals.map((e) => <td key={e.id} className="mono text-right px-3 py-2.5" style={{ color: NAVY, fontWeight: 700 }}>{e.hours}</td>)}

                        <button
                          onClick={() => { haptic(10); downloadICS({ title: `Pay ${e.name}`, date: rangeEnd, description: `LabourArc payroll for ${e.name}, period ${rangeStart} to ${rangeEnd}: ${fmtMoney(e.net, settings.currency)} net.` }); }}
                          className="text-xs px-3 py-1.5 rounded-full flex items-center gap-1.5"
                          style={{ fontWeight: 700, background: BG, color: NAVY, border: `1px solid ${BORDER}` }}
                        >
                          <CalendarIcon size={12} />Add Pay Date
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}

        {tab === "history" && (
          <div>
            <div className="text-xs mb-3" style={{ color: SLATE }}>Deleted crew and time entries stay here so you can restore them.</div>
            {deletedLog.length === 0 ? <Empty text="Nothing deleted yet." /> : (
              <div className="space-y-2">
                {deletedLog.map((d) => (
                  <Row key={d.id}>
                    <div>
                      <div style={{ fontWeight: 600, color: NAVY }}>{d.label}</div>
                      <div className="mono text-xs" style={{ color: SLATE }}>{d.type === "employee" ? "Crew member" : "Time entry"} · deleted {fmtRelative(d.deletedAt)}</div>
                    </div>
                    <div className="flex items-center gap-3">
                      <button onClick={() => restoreItem(d.id)} className="text-xs px-3 py-1.5 rounded-lg flex items-center gap-1.5" style={{ background: GREEN, color: "white", fontWeight: 700 }}>

            )}

      {noteCell && (
        <NoteModal

          hours={gridHours[noteCell.employeeId + "|" + noteCell.date] || 0}
          existing={dayNotes[noteCell.employeeId + "|" + noteCell.date] || ""}
          onSave={(text) => { saveNote(noteCell.employeeId, noteCell.date, text); setNoteCell(null); }}
          onClose={() => setNoteCell(null)}
        />
      )}
      {payslipEmp && (
        <PayslipModal employee={employees.find((e) => e.id === payslipEmp)} rangeStart={rangeStart} rangeEnd={rangeEnd} days={days} gridHours={gridHours} dayNotes={dayNotes} settings={settings} entries={entries} onClose={() => setPayslipEmp(null)} />
      )}
      {bulkPayslip && (

      )}
      {settingsOpen && (
        <SettingsModal
          employerPin={employerPin}
          workspace={workspace}
          settings={settings}
          jobSites={jobSites}
          onChangePin={(pin) => persist("employerPin", pin, () => {})}
          onSaveSettings={(next) => persist("settings", next, () => {})}
          onSaveSites={(next) => persist("jobSites", next, () => {})}
          allData={{ employees, entries, dayNotes, paidRanges, deletedLog, employerPin, jobSites, settings }}
          onImport={(data) => {
            if (data.employees) persist("employees", data.employees, setEmployees);
            if (data.entries) persist("entries", data.entries, setEntries);
            if (data.dayNotes) persist("dayNotes", data.dayNotes, setDayNotes);
            if (data.paidRanges) persist("paidRanges", data.paidRanges, setPaidRanges);
            if (data.deletedLog) persist("deletedLog", data.deletedLog, setDeletedLog);
            if (data.employerPin !== undefined) persist("employerPin", data.employerPin, setEmployerPin);
            if (data.jobSites) persist("jobSites", data.jobSites, setJobSites);
            if (data.settings) persist("settings", { ...DEFAULT_SETTINGS, ...data.settings }, setSettings);
          }}
          onClose={() => setSettingsOpen(false)}
          onLogout={switchUser}
          onContactUs={() => setContactOpen(true)}
        />
      )}
      {contactOpen && <ContactUsModal onClose={() => setContactOpen(false)} />}
      {detailEmpId && (
        <CrewDetailModal
          employee={employees.find((e) => e.id === detailEmpId)}
          myEntries={entries.filter((t) => t.employeeId === detailEmpId).sort((a, b) => (a.date < b.date ? 1 : -1))}
          jobSites={jobSites}
          onSave={(patch) => saveEmployeesLocal(employees.map((e) => (e.id === detailEmpId ? { ...e, ...patch } : e)))}
          onResetPin={() => resetEmpPin(detailEmpId)}
          onRemove={() => { removeEmployee(detailEmpId); setDetailEmpId(null); }}
          onClose={() => setDetailEmpId(null)}
        />
      )}
      {detailSiteId && (
        <SiteDetailModal
          site={jobSites.find((s) => s.id === detailSiteId)}
          spend={siteSpend(detailSiteId)}
          hours={siteHours(detailSiteId)}
          crew={siteCrewIds(detailSiteId).map((id) => employees.find((e) => e.id === id)).filter(Boolean)}
          onSave={(patch) => saveSitesLocal(jobSites.map((s) => (s.id === detailSiteId ? { ...s, ...patch } : s)))}
          onClose={() => setDetailSiteId(null)}
        />
      )}
      {reviewPayrollOpen && (
        <PayrollReviewModal
          employees={employees}
          entries={entries}
          settings={settings}
          workspace={workspace}
          onSent={(periodEnd) => {
            persist("sentPayrollSummaries", [...(sentPayrollSummaries || []), periodEnd], setSentPayrollSummaries);
            setReviewPayrollOpen(false);
          }}
          onClose={() => setReviewPayrollOpen(false)}
        />
      )}
      {reportsOpen && (
        <ReportsModal
          employees={employees}
          entries={entries}
          jobSites={jobSites}
          timeOffMarks={timeOffMarks}
          settings={settings}
          onClose={() => setReportsOpen(false)}

      )}
    </div>
  );
}

/* ================= EMPLOYEE APP ================= */

function roundToHalfHour(hoursDecimal) {
  return Math.round(hoursDecimal * 2) / 2;
}
function roundHoursForSettings(hoursDecimal, settings) {
  const r = settings && settings.rounding;
  if (!r || !r.enabled) return Math.round(hoursDecimal * 100) / 100; // exact, just clean float noise
  const intervalHrs = (r.interval || 15) / 60;
  return Math.round(hoursDecimal / intervalHrs) * intervalHrs;
}
function minutesBetween(start, end) {
  const [sh, sm] = start.split(":").map(Number);
  const [eh, em] = end.split(":").map(Number);
  let mins = (eh * 60 + em) - (sh * 60 + sm);
  if (mins < 0) mins += 24 * 60; // handle overnight shifts
  return mins;
}

function EmployeeApp({ me, entries, dayNotes, jobSites, settings, workspaceId, persist, allEntries, switchUser, activeShifts, setActiveShifts, setEntries, setDayNotes, timeOffMarks, setTimeOffMarks }) {
  const [tab, setTab] = useState("log");
  const [logDate, setLogDate] = useState(todayStr());
  const [startTime, setStartTime] = useState("");
  const [endTime, setEndTime] = useState("");
  const [logSiteId, setLogSiteId] = useState("");
  const [logNote, setLogNote] = useState("");
  const [logTravelMin, setLogTravelMin] = useState("");
  const [rangeStart, setRangeStart] = useState(getMonday(todayStr()));
  const [rangeEnd, setRangeEnd] = useState(todayStr());
  const [payslipOpen, setPayslipOpen] = useState(false);
  const [contactOpen, setContactOpen] = useState(false);
  const [remindMe, setRemindMe] = useState(() => localStorage.getItem("la_remind_" + me.id) === "1");
  const [pushOn, setPushOn] = useState(() => localStorage.getItem("la_push_" + me.id) === "1");
  const [pushBusy, setPushBusy] = useState(false);
  const [clockSiteId, setClockSiteId] = useState("");
  const [nowTick, setNowTick] = useState(Date.now());

  const myShift = activeShifts && activeShifts[me.id];

  useEffect(() => {
    if (!myShift) return;
    const iv = setInterval(() => setNowTick(Date.now()), 1000);
    return () => clearInterval(iv);
  }, [myShift]);

  function startShift() {
    haptic(15);
    const next = { ...(activeShifts || {}), [me.id]: { startedAt: new Date().toISOString(), siteId: clockSiteId || null } };
    persist("activeShifts", next, setActiveShifts);
  }
  function endShift() {
    if (!myShift) return;
    haptic(20);
    const startedAt = new Date(myShift.startedAt);
    const hoursRaw = (Date.now() - startedAt.getTime()) / 3600000;
    const hours = roundHoursForSettings(hoursRaw, settings);
    const entry = { id: uid(), employeeId: me.id, date: todayStr(), hours: Math.max(hours, 0.5), siteId: myShift.siteId || null, startTime: startedAt.toTimeString().slice(0, 5), endTime: new Date().toTimeString().slice(0, 5) };
    persist("entries", [...allEntries, entry], setEntries);
    const next = { ...(activeShifts || {}) };
    delete next[me.id];
    persist("activeShifts", next, setActiveShifts);
    if (workspaceId) notifyEmployer(workspaceId, "Shift ended", `${me.name} clocked out after ${entry.hours}h.`);
  }
  const liveElapsedSec = myShift ? Math.max(0, Math.floor((nowTick - new Date(myShift.startedAt).getTime()) / 1000)) : 0;
  const liveHrs = Math.floor(liveElapsedSec / 3600);
  const liveMin = Math.floor((liveElapsedSec % 3600) / 60);
  const liveSec = liveElapsedSec % 60;
  const liveSiteName = myShift && myShift.siteId ? (jobSites.find((s) => s.id === myShift.siteId) || {}).name : null;

  const myEntries = useMemo(() => allEntries.filter((t) => t.employeeId === me.id).sort((a, b) => (a.date < b.date ? 1 : -1)), [allEntries, me.id]);

  async function togglePush() {
    if (pushOn) { setPushOn(false); localStorage.setItem("la_push_" + me.id, "0"); return; }
    setPushBusy(true);
    const res = await subscribeToPush(workspaceId, "employee", me.id);
    setPushBusy(false);
    if (res.ok) { setPushOn(true); localStorage.setItem("la_push_" + me.id, "1"); }
    else alert("Couldn't enable notifications — check your device's notification settings and try again.");
  }

  async function toggleRemindMe() {
    if (!remindMe) {
      const ok = await requestNotifyPermission();
      if (!ok) { alert("Notifications are blocked for this app — enable them in your device settings to use reminders."); return; }
    }
    const next = !remindMe;
    setRemindMe(next);
    localStorage.setItem("la_remind_" + me.id, next ? "1" : "0");
  }

  useEffect(() => {
    if (!remindMe) return;
    const loggedToday = myEntries.some((t) => t.date === todayStr());
    if (!loggedToday) {
      const t = setTimeout(() => showLocalNotification("Don't forget to log your hours", "Tap LabourArc to add today's hours before you forget."), 3000);
      return () => clearTimeout(t);
    }
  }, [remindMe, myEntries]);

  const computedHours = startTime && endTime ? roundHoursForSettings(minutesBetween(startTime, endTime) / 60, settings) : 0;

  function addEntry() {
    if (!logDate || !startTime || !endTime || computedHours <= 0) return;
    haptic(15);
    const travelMin = Math.max(0, Number(logTravelMin) || 0);
    const totalHours = Math.round((computedHours + travelMin / 60) * 100) / 100;
    const entry = { id: uid(), employeeId: me.id, date: logDate, hours: totalHours, startTime, endTime, siteId: logSiteId || null, travelMinutes: travelMin || undefined };
    persist("entries", [...allEntries, entry], setEntries);
    if (logNote.trim()) {
      const key = me.id + "|" + logDate;
      persist("dayNotes", { ...dayNotes, [key]: logNote.trim() }, setDayNotes);
    }
    if (workspaceId) {
      notifyEmployer(workspaceId, "Hours logged", `${me.name} logged ${totalHours}h on ${fmtDate(logDate)}.`);
      if (totalHours > 12) {
        notifyEmployer(workspaceId, "Unusually long day", `${me.name} logged ${totalHours}h on ${fmtDate(logDate)} — you may want to double check this.`);
      }
    }
    setStartTime(""); setEndTime(""); setLogNote(""); setLogSiteId(""); setLogTravelMin("");
  }
  function setPreset(preset) {
    const t = todayStr();
    if (preset === "thisWeek") { setRangeStart(getMonday(t)); setRangeEnd(t); }
    else if (preset === "lastWeek") { const lm = addDays(getMonday(t), -7); setRangeStart(lm); setRangeEnd(addDays(lm, 6)); }
    else if (preset === "last30") { setRangeStart(addDays(t, -29)); setRangeEnd(t); }
  }
  const days = useMemo(() => (rangeStart <= rangeEnd ? dateRange(rangeStart, rangeEnd) : []), [rangeStart, rangeEnd]);
  const gridHours = useMemo(() => {
    const map = {};
    for (const t of allEntries) {
      if (t.employeeId !== me.id) continue;
      if (t.date < rangeStart || t.date > rangeEnd) continue;
      map[t.employeeId + "|" + t.date] = (map[t.employeeId + "|" + t.date] || 0) + t.hours;
    }
    return map;
  }, [allEntries, me.id, rangeStart, rangeEnd]);
  const calc = useMemo(() => calcPay(me, days, gridHours, settings), [me, days, gridHours, settings]);

  return (
    <div className="flex-1 flex flex-col">
      <div className="no-print" style={{ background: DARK }}>
        <div className="stripe-divider" />
        <div className="max-w-4xl mx-auto px-5 pt-6 pb-4">
          <div className="flex items-center justify-between">
            <img src="icons/labourarc-logo.png" alt="LabourArc" style={{ height: 34, objectFit: "contain" }} />
            <div className="flex items-center gap-3">
              <button onClick={() => setContactOpen(true)} className="text-xs" style={{ color: SLATE, fontWeight: 600 }}>Contact Us</button>
              <button onClick={switchUser} className="text-xs" style={{ color: SLATE, fontWeight: 600 }}>Log Out</button>
            </div>
          </div>
          <div className="mono text-xs mt-1" style={{ color: SLATE, letterSpacing: "0.1em" }}>{me.name.toUpperCase()}</div>
          <div className="flex gap-5 mt-5 border-b" style={{ borderColor: BORDER }}>
            {[{ id: "log", label: "Log Hours", icon: ClockIcon }, { id: "pay", label: "My Payroll", icon: DollarIcon }].map((t) => {
              const Ic = t.icon; const active = tab === t.id;
              return (
                <button key={t.id} onClick={() => setTab(t.id)} className="brand text-sm pb-3 flex items-center gap-1.5" style={{ fontWeight: 700, letterSpacing: "0.02em", color: active ? ROYAL : SLATE, borderBottom: `2px solid ${active ? ROYAL : "transparent"}` }}>
                  <Ic size={14} />{t.label}
                </button>
              );
            })}
          </div>
        </div>
      </div>

      <div className="max-w-4xl mx-auto px-5 py-6 no-print w-full flex-1">
        {tab === "log" && (
          <div>
            <div className="p-5 rounded-xl mb-4 shadow-sm relative overflow-hidden" style={{ background: CARD, border: `1px solid ${BORDER}` }}>
              <div style={{ position: "absolute", top: 0, left: 0, width: 4, height: "100%", background: myShift ? GREEN : ROYAL }} />
              <div style={{ paddingLeft: 6 }}>
                {myShift ? (
                  <>
                    <div className="flex items-center gap-2 mb-1">
                      <span style={{ width: 8, height: 8, borderRadius: "50%", background: GREEN, display: "inline-block" }} />
                      <span className="brand text-sm" style={{ color: GREEN, fontWeight: 700, letterSpacing: "0.05em" }}>ON THE CLOCK{liveSiteName ? " · " + liveSiteName : ""}</span>
                    </div>
                    <div className="brand mono" style={{ color: NAVY, fontSize: 44, fontWeight: 800, letterSpacing: "0.02em" }}>
                      {String(liveHrs).padStart(2, "0")}:{String(liveMin).padStart(2, "0")}:{String(liveSec).padStart(2, "0")}
                    </div>
                    <button onClick={endShift} className="w-full text-sm px-4 py-3 rounded-lg text-white mt-3" style={{ background: RED, fontWeight: 800 }}>Clock Out</button>
                  </>
                ) : (
                  <>
                    <div className="brand text-sm mb-3" style={{ color: NAVY, fontWeight: 700, letterSpacing: "0.05em" }}>CLOCK IN</div>
                    {jobSites.length > 0 && (
                      <select value={clockSiteId} onChange={(e) => setClockSiteId(e.target.value)} className="w-full px-3 py-2 rounded-lg border text-sm mb-3" style={{ borderColor: BORDER, background: BG, color: NAVY }}>
                        <option value="">No job site selected</option>
                        {jobSites.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
                      </select>
                    )}
                    <button onClick={startShift} className="w-full text-sm px-4 py-3 rounded-lg text-white" style={{ background: ROYAL, fontWeight: 800 }}>Start Shift</button>
                  </>
                )}
              </div>
            </div>

            <button onClick={togglePush} disabled={pushBusy} className="w-full text-left text-xs px-3 py-2 rounded-lg mb-2 flex items-center justify-between" style={{ background: pushOn ? "rgba(255,107,26,0.15)" : BG, color: NAVY, border: `1px solid ${BORDER}` }}>
              <span style={{ fontWeight: 600 }}>Push notifications (payroll updates)</span>
              <span style={{ color: pushOn ? ROYAL : SLATE, fontWeight: 700 }}>{pushBusy ? "…" : pushOn ? "On" : "Off"}</span>
            </button>
            <button onClick={toggleRemindMe} className="w-full text-left text-xs px-3 py-2 rounded-lg mb-3 flex items-center justify-between" style={{ background: remindMe ? "rgba(255,107,26,0.15)" : BG, color: NAVY, border: `1px solid ${BORDER}` }}>
              <span style={{ fontWeight: 600 }}>Remind me to log hours today</span>
              <span style={{ color: remindMe ? ROYAL : SLATE, fontWeight: 700 }}>{remindMe ? "On" : "Off"}</span>
            </button>
            <Card icon={ClockIcon} title="Log Past Hours">
              <input type="date" value={logDate} onChange={(e) => setLogDate(e.target.value)} className="w-full px-3 py-2 rounded-lg border text-sm mono mb-2" style={{ borderColor: BORDER, background: BG, color: NAVY }} />
              <div className="flex gap-2 mb-2">
                <div className="flex-1">
                  <div className="text-xs mb-1" style={{ color: SLATE }}>Start time</div>
                  <input type="time" value={startTime} onChange={(e) => setStartTime(e.target.value)} className="w-full px-3 py-2 rounded-lg border text-sm mono" style={{ borderColor: BORDER, background: BG, color: NAVY }} />
                </div>
                <div className="flex-1">
                  <div className="text-xs mb-1" style={{ color: SLATE }}>End time</div>
                  <input type="time" value={endTime} onChange={(e) => setEndTime(e.target.value)} className="w-full px-3 py-2 rounded-lg border text-sm mono" style={{ borderColor: BORDER, background: BG, color: NAVY }} />
                </div>
              </div>
              {computedHours > 0 && (
                <div className="text-xs mb-2 mono" style={{ color: ROYAL, fontWeight: 700 }}>{computedHours}h{settings.rounding && settings.rounding.enabled ? ` (rounded to nearest ${settings.rounding.interval} min)` : " (exact)"}</div>
              )}
              {jobSites.length > 0 && (
                <select value={logSiteId} onChange={(e) => setLogSiteId(e.target.value)} className="w-full px-3 py-2 rounded-lg border text-sm mb-2" style={{ borderColor: BORDER, background: BG, color: NAVY }}>
                  <option value="">No job site selected</option>
                  {jobSites.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
                </select>

function toISO(d) { return d.toISOString().slice(0, 10); }

function getPayPeriodRange(payPeriod, which) {
  const t = todayStr();
  if (payPeriod.type === "semimonthly") {
    const d = new Date(t + "T00:00:00");
    const day = d.getDate();
    let start, end;
    if (which === "current") {
      if (day <= 15) { start = new Date(d.getFullYear(), d.getMonth(), 1); end = new Date(d.getFullYear(), d.getMonth(), 15); }
      else { start = new Date(d.getFullYear(), d.getMonth(), 16); end = new Date(d.getFullYear(), d.getMonth() + 1, 0); }
    } else {
      if (day <= 15) { end = new Date(d.getFullYear(), d.getMonth(), 0); start = new Date(end.getFullYear(), end.getMonth(), 16); }
      else { start = new Date(d.getFullYear(), d.getMonth(), 1); end = new Date(d.getFullYear(), d.getMonth(), 15); }
    }
    return { start: toISO(start), end: toISO(end) };
  }
  if (payPeriod.type === "biweekly") {
    const anchor = payPeriod.biweeklyAnchor || t;
    const diffDays = Math.floor((new Date(t + "T00:00:00") - new Date(anchor + "T00:00:00")) / 86400000);
    const periodIndex = Math.floor(diffDays / 14);
    const idx = which === "current" ? periodIndex : periodIndex - 1;
    const start = addDays(anchor, idx * 14);
    return { start, end: addDays(start, 13) };
  }
  if (payPeriod.type === "monthly") {
    const d = new Date(t + "T00:00:00");
    if (which === "current") {
      return { start: toISO(new Date(d.getFullYear(), d.getMonth(), 1)), end: toISO(new Date(d.getFullYear(), d.getMonth() + 1, 0)) };
    }
    return { start: toISO(new Date(d.getFullYear(), d.getMonth() - 1, 1)), end: toISO(new Date(d.getFullYear(), d.getMonth(), 0)) };
  }
  const weekStart = getWeekStart(t, payPeriod.weekStartsOn);
  const start = which === "current" ? weekStart : addDays(weekStart, -7);
  return { start, end: addDays(start, 6) };
}

function DateRangeBar({ rangeStart, rangeEnd, setRangeStart, setRangeEnd, setPreset, settings }) {
  function goPeriod(which) {
    if (!settings) return;
    const { start, end } = getPayPeriodRange(settings.payPeriod, which);
    setRangeStart(start);
    setRangeEnd(end);
  }
  return (
    <div className="p-4 rounded-xl mb-4 flex flex-wrap items-center gap-3 shadow-sm" style={{ background: CARD, border: `1px solid ${BORDER}` }}>
      <div className="flex items-center gap-2">

      </div>

            <button onClick={() => goPeriod("previous")} className="text-xs px-3 py-1.5 rounded-full" style={{ fontWeight: 600, background: BG, color: NAVY, border: `1px solid ${BORDER}` }}>Previous Pay Period</button>

        <circle cx="50" cy="50" r={r} fill="none" stroke={ROYAL} strokeWidth="8" strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round" transform="rotate(-90 50 50)" />
        <text x="50" y="47" textAnchor="middle" fontSize="20" fontWeight="800" fill={NAVY} fontFamily="'IBM Plex Mono', monospace">{weekHours.toFixed(1)}</text>

function applyBreakDeduction(dayHours, settings) {
  if (!dayHours || !settings.breakDeduction || !settings.breakDeduction.enabled) return dayHours;
  const reduced = dayHours - settings.breakDeduction.minutes / 60;
  return Math.max(0, reduced);
}

// Given a per-day hours map for one employee across a date range, returns
// { totalHours, regularHours, overtimeHours } after break deduction + overtime rules.
function calcEmployeeHours(employeeId, days, gridHours, settings) {
  // Apply break deduction per worked day first
  const dayValues = days.map((d) => applyBreakDeduction(gridHours[employeeId + "|" + d] || 0, settings));
  const totalHours = dayValues.reduce((s, h) => s + h, 0);

  if (!settings.overtime || !settings.overtime.enabled) {
    return { totalHours, regularHours: totalHours, overtimeHours: 0 };
  }

  if (settings.overtime.threshold === "daily") {
    let regular = 0, overtime = 0;
    for (const h of dayValues) {
      regular += Math.min(h, 8);
      overtime += Math.max(0, h - 8);
    }
    return { totalHours, regularHours: regular, overtimeHours: overtime };
  }

  // weekly: group by ISO week (Monday start)
  const weekTotals = {};
  days.forEach((d, i) => {
    const wk = getMonday(d);
    weekTotals[wk] = (weekTotals[wk] || 0) + dayValues[i];
  });
  let regular = 0, overtime = 0;
  Object.values(weekTotals).forEach((wkHours) => {
    regular += Math.min(wkHours, 40);
    overtime += Math.max(0, wkHours - 40);
  });
  return { totalHours, regularHours: regular, overtimeHours: overtime };
}

// Full pay breakdown for one employee over a range: gross, itemized deductions, net.
function calcPay(employee, days, gridHours, settings) {
  const { totalHours, regularHours, overtimeHours } = calcEmployeeHours(employee.id, days, gridHours, settings);
  const multiplier = settings.overtime && settings.overtime.enabled ? settings.overtime.multiplier : 1;
  const gross = regularHours * employee.rate + overtimeHours * employee.rate * multiplier;
  const deductionLines = (settings.deductions || []).map((d) => ({
    label: d.label,
    amount: d.type === "percent" ? gross * (d.value / 100) : d.value,
  }));
  const totalDeductions = deductionLines.reduce((s, d) => s + d.amount, 0);
  const net = Math.max(0, gross - totalDeductions);
  return { totalHours, regularHours, overtimeHours, gross, deductionLines, totalDeductions, net };
}

function PayrollReviewModal({ employees, entries, settings, workspace, onSent, onClose }) {
  const [sending, setSending] = useState(false);
  const [error, setError] = useState("");

  const period = getPayPeriodRange(settings.payPeriod, "previous");
  const days = useMemo(() => dateRange(period.start, period.end), [period.start, period.end]);
  const gridHours = useMemo(() => {
    const map = {};
    for (const t of entries) { if (t.date >= period.start && t.date <= period.end) map[t.employeeId + "|" + t.date] = (map[t.employeeId + "|" + t.date] || 0) + t.hours; }
    return map;
  }, [entries, period.start, period.end]);

  const rows = employees.map((e) => ({ employee: e, calc: calcPay(e, days, gridHours, settings) })).filter((r) => r.calc.totalHours > 0);
  const total = rows.reduce((s, r) => s + r.calc.net, 0);
  const noEmail = employees.filter((e) => !e.email).length;

  async function handleSend() {
    setSending(true);
    setError("");
    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/send-payroll-summary`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${SUPABASE_ANON_KEY}`, "apikey": SUPABASE_ANON_KEY },
        body: JSON.stringify({ workspaceId: workspace.id, periodStart: period.start, periodEnd: period.end }),
      });
      if (!res.ok) throw new Error("Send failed (" + res.status + ")");
      onSent(period.end);
    } catch (e) {
      setError(e.message || "Couldn't send — check your connection and try again.");
    } finally {
      setSending(false);
    }

  return (
